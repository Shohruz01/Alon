<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>СУРХ</title>

<style>

:root{
 --p:#2563eb;
 --a:#ff4757;
 --bg:#f2f4f8;
 --card:#fff;
 --radius:20px;
 --blur:blur(18px);
 --shadow:0 12px 30px rgba(0,0,0,.12);
}

/* RESET */

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:system-ui,-apple-system;
}

html,body{
 width:100%;
 overflow-x:hidden;
}

/* HEADER */

.header{
 position:sticky;
 top:0;
 z-index:9999;
 background:rgba(255,255,255,.85);
 backdrop-filter:var(--blur);
 padding:16px;
 font-size:20px;
 font-weight:900;
 text-align:center;
 box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.logo-box{
 display:flex;
 justify-content:center;
 align-items:center;
}

.logo-box img{
 height:42px;
 max-width:140px;
 object-fit:contain;
}

/* SEARCH */

.pro-filter{
 position:sticky;
 top:60px;
 z-index:999;
 padding:10px;
 background:transparent;
}

.pro-filter input,
.pro-filter select{
 width:100%;
 margin-top:8px;
 padding:14px;
 border:none;
 border-radius:16px;
 box-shadow:var(--shadow);
}

/* ===== SOMON STYLE CATEGORY GRID ===== */

.categories{
 padding:14px;
}

.main-cats{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
 gap:12px;
}

/* CATEGORY CARD */

.cat-title{
 background:#ffffff;
 border-radius:18px;

 padding:14px 10px;
 min-height:92px;

 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 gap:8px;

 font-size:14px;
 font-weight:800;
 color:#111;

 width:100%;

 box-shadow:
 0 8px 20px rgba(0,0,0,.08),
 inset 0 -1px 0 rgba(0,0,0,.05);

 transition:
 transform .12s ease,
 box-shadow .12s ease,
 background .12s ease;

 user-select:none;
 -webkit-tap-highlight-color:transparent;
}

/* ICON */

.cat-title span:first-child{
 font-size:28px;
 line-height:1;
}

/* TEXT */

.cat-title span:last-child{
 text-align:center;
 line-height:1.15;
}

/* PRESS EFFECT */

.cat-title:active{
 transform:scale(.96);
 box-shadow:0 4px 10px rgba(0,0,0,.1);
 background:#f7f9fc;
}

/* IOS SAFE FIX */

@supports (-webkit-touch-callout: none){
 .cat-title{
  padding-top:16px;
 }
}

/* SUB CATEGORY */

.subcats{
 margin-top:12px;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;

 max-height:0;
 overflow:hidden;
 transition:.3s ease;
}

.subcats.show{
 max-height:500px;
}

/* SUB ITEM */

.cat{
 background:#f8fafc;
 border-radius:14px;
 padding:12px;
 text-align:center;
 font-size:13px;
 font-weight:600;
 box-shadow:0 2px 6px rgba(0,0,0,.05);
}

/* MOBILE */

@media(max-width:480px){

 .categories{
  grid-template-columns:repeat(2,1fr);
 }

 .subcats{
  grid-template-columns:repeat(2,1fr);
 }

}

/* MOBILE SAFE */

html,body{
 overflow-x:hidden;
 width:100%;
}

/* ADS GRID */

.ads{
 padding:12px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
 gap:14px;
}

/* CARD */

.ad-card{
 position:relative;
 background:white;
 border-radius:18px;
 overflow:hidden;
 box-shadow:var(--shadow);
 transition:.15s;
}

.ad-card:active{
 transform:scale(.97);
}

/* IMAGE */

.ad-card img{
 width:100%;
 height:170px;
 object-fit:cover;
}

/* INFO */

.ad-info{
 padding:10px;
}

.ad-price{
 font-weight:900;
 color:#16a34a;
}

.ad-title{
 font-size:14px;
 font-weight:700;
 margin-top:4px;
}

.ad-city{
 font-size:12px;
 opacity:.7;
}

/* LIKE */

.like-btn{
 position:absolute;
 top:10px;
 right:10px;

 width:36px;
 height:36px;

 background:white;
 border-radius:50%;

 display:flex;
 align-items:center;
 justify-content:center;

 font-size:18px;

 box-shadow:0 4px 12px rgba(0,0,0,.25);
 z-index:10;
}

.like-btn.active{
 background:#ff4757;
 color:white;
}

/* BOTTOM NAV */

.bottom-nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:78px;
 background:rgba(255,255,255,.85);
 backdrop-filter:var(--blur);
 display:flex;
 justify-content:space-around;
 align-items:center;
 box-shadow:0 -6px 16px rgba(0,0,0,.08);
 padding-bottom:env(safe-area-inset-bottom);
}

.bottom-nav a{
 font-size:11px;
 text-decoration:none;
 color:#444;
 display:flex;
 flex-direction:column;
 align-items:center;
}

/* PLUS BTN */

.add-btn{
 width:64px;
 height:64px;
 border-radius:50%;
 background:linear-gradient(135deg,#2563eb,#4facfe);
 color:white;
 font-size:28px;
 display:flex;
 align-items:center;
 justify-content:center;
 margin-top:-35px;
 box-shadow:0 12px 30px rgba(37,99,235,.6);
}

/* SKELETON */

.skeleton{
 background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
 background-size:200% 100%;
 animation:skeleton 1.2s infinite;
 height:170px;
 border-radius:18px;
}

@keyframes skeleton{
 0%{background-position:0%}
 100%{background-position:200%}
}

.lang-box{
 position:absolute;
 right:12px;
 top:12px;
 display:flex;
 gap:6px;
}

.section{
 margin-bottom:22px;
}

.section-title{
 font-size:18px;
 font-weight:900;
 padding:0 12px 8px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.section-row{
 display:flex;
 gap:12px;
 padding:0 12px;
 overflow-x:auto;
 scroll-snap-type:x mandatory;
}

.section-row::-webkit-scrollbar{
 display:none;
}

.section-row .ad-card{
 min-width:170px;
 scroll-snap-align:start;
}

.vip-badge{
 position:absolute;
 top:10px;
 left:10px;
 background:#facc15;
 color:#000;
 font-size:12px;
 font-weight:900;
 padding:4px 8px;
 border-radius:8px;
 z-index:5;
}

.logo-box{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:6px;
}

.logo-img{
 height:46px;
}

.stats-box{
 display:flex;
 gap:8px;
}

.stat{
 font-size:12px;
 font-weight:700;
 padding:4px 10px;
 border-radius:20px;
 background:#f1f5f9;
 display:flex;
 align-items:center;
 gap:4px;
}

.online{
 background:#22c55e;
 color:white;
 position:relative;
}

.total{
 background:#2563eb;
 color:white;
}

.pulse{
 width:8px;
 height:8px;
 background:#fff;
 border-radius:50%;
 animation:pulse 1.5s infinite;
}

@keyframes pulse{
 0%{box-shadow:0 0 0 0 rgba(255,255,255,.7);}
 70%{box-shadow:0 0 0 10px rgba(255,255,255,0);}
 100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
}

.book-btn{
 position:fixed;
 bottom:75px;
 right:20px;
 background:#27ae60;
 color:white;
 border:none;
 padding:14px 18px;
 border-radius:50px;
 font-weight:bold;
 box-shadow:0 6px 15px rgba(0,0,0,.2);
}

.tabs{
 display:flex;
 position:sticky;
 top:130px;
 z-index:999;
 background:white;

 margin:10px 12px;
 border-bottom:1px solid #eee;
}

.tab{
 flex:1;
 text-align:center;
 padding:12px 0;
 font-weight:600;
 color:#999;
 cursor:pointer;
}

.tab.active{

}

.tab-line{
 position:absolute;
 bottom:0;
 left:0;
 width:33.33%;
 height:3px;
 background:linear-gradient(90deg,#ff7a18,#ffb347);
 border-radius:10px;
 transition:.25s;
}

.ads{
 padding-bottom:100px;
}

#homeSections{
 margin-bottom:10px;
}

.tabs{
 margin-top:10px;
 background:white;
 border-radius:14px;
}

</style>

</head>

<script>

/* ================= STORAGE ================= */

let likes = JSON.parse(localStorage.getItem("likes")) || {};
let favs  = JSON.parse(localStorage.getItem("favs"))  || [];

/* ================= DATA ================= */

let ALL_ADS = [];
let currentCategory = "";

/* ================= ELEMENTS ================= */

const adsBox   = document.getElementById("ads");
const citySel  = document.getElementById("citySelect");
const searchIn = document.getElementById("searchInput");

/* ================= SKELETON ================= */

function showSkeleton(){
 adsBox.innerHTML = `
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
 `;
}

/* ================= LOAD ADS ================= */

showSkeleton();

fetch("/api/normal-ads")
.then(r=>r.json())
.then(data=>{
 ALL_ADS = data;

 renderHomeSections();   // барои саҳифаи HOME
 renderFiltered();       // барои search/filter
});

/* ================= FILTER ================= */

const params = new URLSearchParams(window.location.search);
const urlCat = params.get("cat");

if(urlCat){
 currentCategory = urlCat;
}

function renderFiltered(){

 const city   = citySel.value;
 const search = searchIn.value.toLowerCase();

 let result = [...ALL_ADS];

 // TAB FILTER
 if(CURRENT_TAB==="new"){
  result.sort((a,b)=>b.id-a.id);
 }

 if(CURRENT_TAB==="popular"){
  result.sort((a,b)=>(b.views||0)-(a.views||0));
 }

 if(CURRENT_TAB==="top"){
  result.sort((a,b)=>(b.likes||0)-(a.likes||0));
 }

 // CATEGORY
 if(currentCategory){
  result = result.filter(a=>a.category===currentCategory);
 }

 // CITY
 if(city){
  result = result.filter(a=>a.city===city);
 }

 // SEARCH
 if(search){
  result = result.filter(a=>
   a.title.toLowerCase().includes(search) ||
   a.phone.includes(search)
  );
 }

 adsBox.innerHTML="";

 if(!result.length){
  adsBox.innerHTML=`<p style="padding:20px;text-align:center">Эълон нест ❌</p>`;
  return;
 }

 result.forEach(renderAd);
}

/* ================= EVENTS ================= */

citySel.addEventListener("change",renderFiltered);
let typingTimer;

searchIn.addEventListener("input",()=>{
 clearTimeout(typingTimer);
 typingTimer = setTimeout(renderFiltered,250);
});

/* ================= CATEGORY ================= */

function loadCategory(cat){
 currentCategory = cat;
 renderFiltered();
}

function toggleCat(id){

 const el = document.getElementById(id);
 if(!el) return;

 document.querySelectorAll(".subcats").forEach(box=>{
  if(box !== el){
   box.classList.remove("show");
  }
 });

 el.classList.toggle("show");
}

/* ================= RENDER CARD ================= */

function buildCard(ad){

 const card = document.createElement("div");
 card.className="ad-card";

 card.onclick = ()=>location="/ad.html?id="+ad.id;

 const img = ad.photos?.[0] || "/noimage.png";

 card.innerHTML=`

 <img src="${img}">

 <div class="ad-info">
  <div class="ad-price">💰 ${formatPrice(ad.price)}</div>
  <div class="ad-title">${ad.title}</div>
 </div>
 `;

 return card;
}

function formatPrice(price){

 if(!price) return "0 сомонӣ";

 return Number(price).toLocaleString("ru-RU") + " сомонӣ";
}

function renderAd(ad){

 const card = document.createElement("div");
 card.className="ad-card";

 card.onclick = ()=>location="/ad.html?id="+ad.id;

 const img = ad.photos?.[0] || "/noimage.png";

 card.innerHTML=`

 ${ad.vip ? `<div class="vip-badge">VIP</div>` : ""}

 <div class="like-btn ${likes[ad.id]?"active":""}"
 onclick="event.stopPropagation();toggleLike(${ad.id},this)">
 ❤️
 </div>

 <img loading="lazy" src="${img}">

 <div class="ad-info">
  <div class="ad-price">💰 ${formatPrice(ad.price)}</div>
  <div class="ad-title">${ad.title}</div>
  <div class="ad-city">📍 ${ad.city}</div>
 </div>
 `;

 adsBox.appendChild(card);
}

/* ================= LIKE ================= */

function toggleLike(id,btn){

 if(likes[id]) return;

 likes[id]=1;
 btn.classList.add("active");
 if(!favs.includes(id)) favs.push(id);

 fetch("/api/like",{
  method:"POST",
  headers:{
   "Content-Type":"application/json"
  },
  body:JSON.stringify({adId:id})
 });

 localStorage.setItem("likes",JSON.stringify(likes));
 localStorage.setItem("favs",JSON.stringify(favs));
}

/* ================= LANG ================= */

const translations = {

tj:{

/* APP */
app_name:"СУРХ",

/* NAV */
home:"Хона",
favorites:"Маъқул",
chats:"Паёмҳо",
profile:"Профил",
add:"Илова кардан",

/* SEARCH */
search:"Ҷустуҷӯ...",
city:"Ҳамаи шаҳрҳо",

/* STATUS */
no_ads:"Эълон нест",
loading:"Бор шуда истодааст...",

/* BUTTONS */
btn_login:"Даромад",
btn_register:"Қайд шудан",
btn_save:"Захира",
btn_delete:"Нест кардан",
btn_edit:"Ислоҳ",
btn_send:"Фиристодан",

/* CATEGORIES */
cat_realestate:"Амвол",
cat_transport:"Транспорт",
cat_tech:"Электроника",

function setLang(l){
 localStorage.setItem("lang",l);
 applyLang();
}

function applyLang(){

 const lang = localStorage.getItem("lang")||"tj";

 document.querySelectorAll("[data-key]").forEach(el=>{
  const k=el.dataset.key;
  if(translations[lang][k]) el.innerText=translations[lang][k];
 });

 document.querySelectorAll("[data-key-placeholder]").forEach(el=>{
  const k=el.dataset.keyPlaceholder;
  if(translations[lang][k]) el.placeholder=translations[lang][k];
 });

document.getElementById("onlineBox").title =
 translations[lang].online_title;

}



applyLang();

/* PULL TO REFRESH */

let startY=0;

document.addEventListener("touchstart",e=>{
 startY=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
 let endY=e.changedTouches[0].clientY;
 if(startY<80 && endY-startY>120) location.reload();
});

  document.body.style.transition=".4s";
  document.body.style.opacity=1;
 },30);
};

function goCategory(name){
 window.location.href =
 "/category.html?cat=" + encodeURIComponent(name);
}

const featuredCats = [
 "Мошин",
 "Квартира",
 "Телефон",
 "Хона"
];

function renderHomeSections(){

if(!document.getElementById("homeSections")) return;

 const box = document.getElementById("homeSections");
 box.innerHTML = "";

 const groups = {};

 let ads = [...ALL_ADS];

if(CURRENT_TAB==="new"){
 ads.sort((a,b)=>b.id-a.id);
}

if(CURRENT_TAB==="popular"){
 ads.sort((a,b)=>(b.views||0)-(a.views||0));
}

if(CURRENT_TAB==="top"){
 ads.sort((a,b)=>(b.likes||0)-(a.likes||0));
}

ads.forEach(ad=>{

  if(!featuredCats.includes(ad.category)) return;

  if(!groups[ad.category]){
   groups[ad.category] = [];
  }

  groups[ad.category].push(ad);
 });

 for(const cat in groups){

  const sec = document.createElement("div");
  sec.className = "section";

  sec.innerHTML = `
   <div class="section-title">
    ${cat}
    <span onclick="goCategory('${cat}')"
     style="font-size:14px;color:#2563eb">
     Ҳама →
    </span>
   </div>

   <div class="section-row"></div>
  `;

  box.appendChild(sec);

  const row = sec.querySelector(".section-row");

  groups[cat].slice(0,8).forEach(ad=>{
   row.appendChild(buildCard(ad));
  });
 }

 if(!box.innerHTML.trim()){
  box.style.display="none";
 }

}

let CURRENT_TAB = "new";

function setTab(el,type){

 CURRENT_TAB = type;

 document.querySelectorAll(".tab").forEach(t=>{
  t.classList.remove("active");
 });

 el.classList.add("active");

 const line = document.querySelector(".tab-line");

 if(type==="new") line.style.left="0%";
 if(type==="popular") line.style.left="33.33%";
 if(type==="top") line.style.left="66.66%";

 renderHomeSections();   // 🔥 ИНРО ИЛОВА КАРДЕМ
 renderFiltered();
}
