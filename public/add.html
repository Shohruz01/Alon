/* ================= EVENTS ================= */

catSel.addEventListener("change", loadSubs);

/* ================= LOAD SUB ================= */

function loadSubs(){

 const cat = catSel.value;

 // Mongo category string match
 if(!cat || !SUBS[cat]){
  subSel.style.display = "none";
  subSel.innerHTML = "";
  subSel.value = "";
  return;
 }

 const lang = localStorage.getItem("lang") || "tj";

 subSel.style.display = "block";
 subSel.innerHTML = "";

 // Default option
 const def = document.createElement("option");
 def.value = "";
 def.textContent = lang==="tj"
  ? "Зеркатегория"
  : "Подкатегория";

 subSel.appendChild(def);

 // Add subs
 SUBS[cat].forEach(s=>{

  const opt = document.createElement("option");

  opt.value = s.id;       // 👉 stored to Mongo as "sub"
  opt.textContent = s[lang];

  subSel.appendChild(opt);

 });

}

/* ================= IMPORTANT ================= */

/*
 ❌ DELETE THIS FROM YOUR PROJECT:

 document.getElementById("adId").value = Date.now();

 Mongo creates _id automatically!
*/

// ===== DOUBLE SUBMIT PROTECTION =====

const form = document.getElementById("addForm");
const btn  = document.getElementById("submitBtn");

let locked = false;

form.addEventListener("submit", (e)=>{

 if(locked){
  e.preventDefault();
  return;
 }

 locked = true;

 btn.disabled = true;
 btn.innerText = "⏳ Бор шуда истодааст...";
 btn.style.opacity = "0.7";

});

function goBack(){
 if(document.referrer){
  history.back();
 }else{
  location.href="/";
 }
}

document.querySelector("form").onsubmit = async function(e){

 e.preventDefault();

 const form = new FormData(this);

 const res = await fetch("/add-ad",{
  method:"POST",
  body:form,
  credentials:"include"
 });

 const data = await res.json();

 if(!data.success){
  alert(data.message);   // 🔥 ОГОҲӢ
  return;
 }

 location.href="/profile";

};
