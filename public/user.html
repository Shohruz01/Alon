<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профиль</title>

<style>

body{
 margin:0;
 background:#f2f4f8;
 font-family:system-ui;
}

.header{
 background:white;
 padding:14px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.profile{
 background:white;
 margin:12px;
 padding:18px;
 border-radius:18px;
 text-align:center;
 box-shadow:0 6px 20px rgba(0,0,0,.1);
}

.avatar{
 width:96px;
 height:96px;
 border-radius:50%;
 object-fit:cover;
 border:3px solid #2563eb;
}

.name{
 font-size:18px;
 font-weight:900;
 margin-top:8px;
}

.city{
 color:#666;
 font-size:14px;
}

.stats{
 display:flex;
 justify-content:space-around;
 margin-top:14px;
}

.stat b{
 font-size:17px;
}

.ads{
 padding:12px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
 gap:12px;
}

.card{
 background:white;
 border-radius:16px;
 overflow:hidden;
 box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.card img{
 width:100%;
 height:150px;
 object-fit:cover;
 background:#eee;
}

.info{
 padding:8px;
}

.price{
 font-weight:900;
 color:#16a34a;
}

.empty{
 text-align:center;
 padding:30px;
 opacity:.6;
 font-weight:700;
}

.backBtn{
 position:fixed;
 top:10px;
 left:10px;
 z-index:999;
 background:#2563eb;
 color:white;
 border:none;
 padding:8px 12px;
 border-radius:10px;
 font-weight:700;
 box-shadow:0 4px 10px rgba(0,0,0,.2);
}

</style>
</head>

<body>

<button onclick="goBack()" class="backBtn">← Назад</button>

<div class="header">
 <button onclick="history.back()">⬅</button>
 <b>Профиль</b>
</div>

<div class="profile">

 <img id="avatar" class="avatar" src="/avatar.png">

 <div id="userName" class="name">...</div>
 <div id="city" class="city"></div>

 <div class="stats">

  <div class="stat">
   <b id="adsCount">0</b>
   <div>Объявления</div>
  </div>

  <div class="stat">
   <b>⭐ 5.0</b>
   <div>Рейтинг</div>
  </div>

  <div class="stat">
   <b style="color:green">● Online</b>
   <div>Статус</div>
  </div>

 </div>

</div>

<div id="ads" class="ads"></div>

<script>

const userId = new URLSearchParams(location.search).get("id");

if(!userId){
 alert("ID not found");
 location="/";
}

// LOAD USER
fetch("/api/user/"+userId)
.then(r=>r.json())
.then(data=>{

 if(!data || !data.success){
  alert("User not found");
  return;
 }

const user = data.user;
const ads  = data.ads;

avatar.src = user.photo || "/avatar.png";

document.getElementById("userName").innerText =
 user.name || "User";

city.innerText = user.city ? "📍 "+user.city : "";

adsCount.innerText = data.adsCount;

 renderAds(ads);

});

// RENDER ADS
function renderAds(list){

 const box=document.getElementById("ads");
 box.innerHTML="";

 if(!list.length){
  box.innerHTML=`<div class="empty">Эълон нест</div>`;
  return;
 }

 list.forEach(ad=>{

  const img = ad.photos?.[0] || "/noimage.png";

  const card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
   <img src="${img}">
   <div class="info">
    <div class="price">💰 ${ad.price}</div>
    <div>${ad.title}</div>
   </div>
  `;

  card.onclick=()=>{
   location="/ad.html?id="+ad._id;
  };

  box.appendChild(card);

 });

}

function goBack(){
 if(document.referrer){
  history.back();
 }else{
  location.href="/";
 }
}

</script>

</body>
</html>
