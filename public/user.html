<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">

<title>User profile</title>

<style>

body{
 margin:0;
 background:#f2f4f8;
 font-family:system-ui;
}

/* HEADER */

.header{
 background:white;
 padding:14px;
 display:flex;
 align-items:center;
 gap:10px;
 box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.back{
 font-size:22px;
}

/* PROFILE CARD */

.profile{
 background:white;
 margin:10px;
 padding:16px;
 border-radius:16px;
 text-align:center;
 box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.avatar{
 width:90px;
 height:90px;
 border-radius:50%;
 object-fit:cover;
 border:3px solid #2563eb;
}

.name{
 font-size:18px;
 font-weight:800;
 margin-top:8px;
}

.city{
 color:#666;
 font-size:14px;
}

.stats{
 display:flex;
 justify-content:space-around;
 margin-top:12px;
}

.stat{
 text-align:center;
}

.stat b{
 font-size:16px;
}

/* ADS GRID */

.ads{
 padding:10px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
 gap:10px;
}

.card{
 background:white;
 border-radius:14px;
 overflow:hidden;
 box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card img{
 width:100%;
 height:150px;
 object-fit:cover;
}

.info{
 padding:8px;
}

.price{
 font-weight:800;
 color:#16a34a;
}

.title{
 font-size:13px;
}

.empty{
 text-align:center;
 padding:30px;
 opacity:.7;
}

</style>
</head>

<body>

<div class="header">
 <div class="back" onclick="history.back()">⬅</div>
 <b>Профили фурӯшанда</b>
</div>

<div class="profile">

 <img id="avatar" class="avatar">

 <div class="name" id="name"></div>
 <div class="city" id="city"></div>

 <div class="stats">

  <div class="stat">
   <b id="adsCount">0</b>
   <div>Эълон</div>
  </div>

  <div class="stat">
   <b>⭐ 5.0</b>
   <div>Рейтинг</div>
  </div>

  <div class="stat">
   <b>🟢 Online</b>
   <div>Статус</div>
  </div>

 </div>

</div>

<div id="ads" class="ads"></div>

<script>

const id = new URLSearchParams(location.search).get("id");

fetch("/api/user/"+id)
.then(r=>r.json())
.then(user=>{

 if(!user){
  alert("User not found");
  return;
 }

 document.getElementById("avatar").src = user.photo;
 document.getElementById("name").innerText = user.username;
 document.getElementById("city").innerText = "📍 " + user.city;
 document.getElementById("adsCount").innerText = user.adsCount;

 const box = document.getElementById("ads");

 if(!user.ads.length){
  box.innerHTML = "<div class='empty'>Эълон нест</div>";
  return;
 }

 user.ads.forEach(ad=>{

  box.innerHTML += `

   <div class="card" onclick="location='/ad.html?id=${ad.id}'">

    <img src="${ad.photos?.[0] || '/noimage.png'}">

    <div class="info">
     <div class="price">💰 ${ad.price}</div>
     <div class="title">${ad.title}</div>
    </div>

   </div>

  `;

 });

});

</script>

</body>
</html>
