<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat</title>

<script localStorage.setItem('chatCount', 0);script>

<script src="/socket.io/socket.io.js"></script>

<style>
body{
 margin:0;
 font-family:Arial;
 background:#f2f2f2;
}

.header{
 background:#2f80ed;
 color:white;
 padding:15px;
 text-align:center;
 font-size:18px;
}

.messages{
 height:75vh;
 overflow-y:auto;
 padding:10px;
}

.msg{
 background:white;
 padding:10px;
 border-radius:10px;
 margin-bottom:8px;
 max-width:80%;
}

.my{
 background:#2f80ed;
 color:white;
 margin-left:auto;
}

.input-box{
 display:flex;
 padding:10px;
 background:white;
 position:fixed;
 bottom:0;
 width:100%;
}

input{
 flex:1;
 padding:10px;
 border-radius:8px;
 border:1px solid #ccc;
}

button{
 margin-left:5px;
 padding:10px 15px;
 background:#2f80ed;
 color:white;
 border:none;
 border-radius:8px;
}
</style>
</head>

<body>

<div class="header">💬 Чат</div>

<div id="messages" class="messages"></div>

<div class="input-box">
<input id="msg" placeholder="Навиштани паём...">
<button onclick="send()">Фиристодан</button>
</div>

<script>

const socket = io();

// гирифтани id-и эълон
const params = new URLSearchParams(window.location.search);
const adId = params.get('ad');

// room барои ҳар эълон
const room = 'ad_' + adId;

// дохил шудан
socket.emit('joinRoom', room);

// қабул
socket.on('chatMessage', data => {

 const box = document.getElementById('messages');

 const div = document.createElement('div');
 div.className = 'msg';

 if(data.me) div.classList.add('my');

 div.innerText = data.text;

 box.appendChild(div);
 box.scrollTop = box.scrollHeight;

});

// фиристодан
function send(){

 const input = document.getElementById('msg');
 const text = input.value;

 if(text === '') return;

 socket.emit('chatMessage',{
  room: room,
  text: text,
  me: true
 });

 let c = localStorage.getItem('chatCount') || 0;
c++;
localStorage.setItem('chatCount', c);

saveChat();

 input.value = '';

}

function saveChat(){

 let chats = JSON.parse(localStorage.getItem('chats')) || [];

 const exists = chats.find(c => c.adId == adId);

 if(!exists){
   chats.push({
    adId: adId,
    title: 'Эълон #' + adId,
    unread: 0
   });
 }

 localStorage.setItem('chats', JSON.stringify(chats));

}

</script>

</body>
</html>
