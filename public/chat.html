<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">

<title>Чат</title>

<style>

body{
 margin:0;
 background:#f2f4f8;
 font-family:system-ui;
}

.top{
 padding:14px;
 background:white;
 font-weight:800;
 text-align:center;
 box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.chat{
 height:calc(100vh - 120px);
 overflow-y:auto;
 padding:10px;
}

.msg{
 max-width:75%;
 padding:10px 14px;
 margin:6px 0;
 border-radius:14px;
 font-size:14px;
}

.me{
 background:#2563eb;
 color:white;
 margin-left:auto;
 border-bottom-right-radius:4px;
}

.other{
 background:white;
 border-bottom-left-radius:4px;
}

.input-box{
 display:flex;
 padding:10px;
 background:white;
}

input{
 flex:1;
 padding:12px;
 border-radius:12px;
 border:1px solid #ddd;
}

button{
 margin-left:8px;
 padding:12px 18px;
 border:none;
 border-radius:12px;
 background:#2563eb;
 color:white;
 font-weight:700;
}

</style>
</head>

<body>

<div class="top">💬 Чат</div>

<div id="chat" class="chat"></div>

<div class="input-box">
 <input id="text" placeholder="Паём навис...">
 <button id="send">➤</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const params = new URLSearchParams(location.search);

const toUser = params.get("to");
if(!toUser){
 alert("Chat user not found");
 location.href="/";
}
const adId   = params.get("ad");

let ME = null;
let ROOM = null;

// ================= GET ME =================

fetch("/api/me",{credentials:"include"})
.then(r=>r.json())
.then(d=>{

 if(!d.logged){
  alert("Login required");
  location.href="/login.html";
  return;
 }

 ME = d.user.id;

 const a = Math.min(Number(ME), Number(toUser));
const b = Math.max(Number(ME), Number(toUser));

 ROOM = a + "_" + b;

 // JOIN ROOM
 socket.emit("joinRoom", ROOM);

 loadHistory();
});

// ================= LOAD HISTORY =================

function loadHistory(){

 fetch("/api/messages/" + ROOM,{credentials:"include"})
 .then(r=>r.json())
 .then(list=>{

  list.forEach(renderMsg);

  scrollBottom();
 });

}

// ================= SEND =================

document.getElementById("send").onclick = sendMsg;

document.getElementById("text").onkeydown = e=>{
 if(e.key==="Enter") sendMsg();
};

function sendMsg(){

 const text = document.getElementById("text").value.trim();

 if(!text) return;

 socket.emit("sendMessage",{
  room: ROOM,
  from: ME,
  to: toUser,
  text
 });

 document.getElementById("text").value="";
}

// ================= RECEIVE =================

socket.on("newMessage", msg => {

 if(msg.room !== ROOM) return;

 renderMsg(msg);
 scrollBottom();

});

// ================= UI =================

function renderMsg(m){

 const div = document.createElement("div");

 div.className = "msg " + (m.from == ME ? "me" : "other");

 div.innerText = m.text;

 document.getElementById("chat").appendChild(div);
}

function scrollBottom(){
 const box = document.getElementById("chat");
 box.scrollTop = box.scrollHeight;
}

</script>

</body>
</html>
