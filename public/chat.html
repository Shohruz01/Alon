<!DOCTYPE html>
<html lang="tj">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">

<title>Chat</title>

<style>

body{
 margin:0;
 background:#f2f4f8;
 font-family:system-ui;

 height:100vh;
 display:flex;
 flex-direction:column;
}

/* HEADER */

.top{
 padding:14px;
 background:white;
 font-weight:800;
 text-align:center;
 box-shadow:0 2px 8px rgba(0,0,0,.1);
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.lang button{
 border:none;
 padding:6px 10px;
 border-radius:8px;
 background:#2563eb;
 color:white;
 font-weight:700;
 margin-left:5px;
}

/* CHAT BOX */

.chat{
 flex:1;
 overflow-y:auto;
 overflow-y:auto;
 padding:10px;
}

/* MESSAGE */

.msg{
 max-width:75%;
 padding:10px 14px;
 margin:6px 0;
 border-radius:14px;
 font-size:14px;
 word-wrap:break-word;
}

.me{
 background:#2563eb;
 color:white;
 margin-left:auto;
 border-bottom-right-radius:4px;
}

.other{
 background:white;
 border-bottom-left-radius:4px;
}

/* INPUT */

.input-box{
 display:flex;
 padding:10px;
 background:white;
 border-top:1px solid #ddd;
}

input{
 flex:1;
 padding:12px;
 border-radius:12px;
 border:1px solid #ddd;
 outline:none;
}

.input-box{
 position:sticky;
 bottom:0;
}

button{
 margin-left:8px;
 padding:12px 18px;
 border:none;
 border-radius:12px;
 background:#2563eb;
 color:white;
 font-weight:700;
}

.header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-bottom:10px;
}

.backBtn{
 background:#2563eb;
 color:white;
 border:none;
 padding:8px 14px;
 border-radius:10px;
 font-weight:700;
 cursor:pointer;
}

</style>
</head>

<body>


<div class="top">

  <button class="backBtn" onclick="history.back()">
    ← Назад
  </button>

  <span>
    <span id="titleTxt">💬 Чат</span>
    <small id="statusTxt" style="font-size:12px;margin-left:6px"></small>
  </span>

  <div class="lang">
    <button onclick="setLang('tj')">TJ</button>
    <button onclick="setLang('ru')">RU</button>
  </div>

</div>

<div id="chat" class="chat"></div>

<div class="input-box">
 <input id="text" placeholder="Паём навис...">
 <button id="send">➤</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>

/* ================= LANGUAGE ================= */

let lang = localStorage.getItem("lang") || "tj";

const TXT = {

 tj:{
  title:"💬 Чат",
  placeholder:"Паём навис...",
  login:"Аввал ворид шавед"
 },

 ru:{
  title:"💬 Чат",
  placeholder:"Введите сообщение...",
  login:"Требуется вход"
 }

};

function setLang(l){
 lang = l;
 localStorage.setItem("lang",l);
 applyLang();
}

function applyLang(){
 titleTxt.innerText = TXT[lang].title;
 text.placeholder = TXT[lang].placeholder;
}

applyLang();

/* ================= SOCKET ================= */

const socket = io();

/* ================= PARAMS ================= */

const params = new URLSearchParams(location.search);

const toUser = params.get("to");

if(!toUser){
 alert("Chat user not found");
 location.href="/";
}

/* ================= GLOBAL ================= */

let ME = null;
let ROOM = null;

/* ================= GET SESSION USER ================= */

fetch("/api/me",{ credentials:"include" })
.then(r=>r.json())
.then(d=>{

 if(!d.logged){
  alert(TXT[lang].login);
  location.href="/login.html";
  return;
 }

ME = d.user._id;

// REGISTER ONLINE
socket.emit("registerUser", ME);

// CREATE ROOM
const users = [ME, toUser].sort();
ROOM = users[0] + "_" + users[1];

socket.emit("joinRoom", ROOM);

loadHistory();
loadOnlineStatus();
setInterval(loadOnlineStatus,5000);

});

/* ================= LOAD CHAT HISTORY ================= */

function loadHistory(){

 fetch("/api/messages/" + ROOM,{
  credentials:"include"
 })
 .then(r=>r.json())
 .then(list=>{

  list.forEach(renderMsg);
  scrollBottom();

 })
 .catch(()=>{
  console.log("No history");
 });

}

/* ================= SEND MESSAGE ================= */

send.onclick = sendMsg;

text.onkeydown = e=>{
 if(e.key==="Enter") sendMsg();
};

function sendMsg(){

 const msg = text.value.trim();

 if(!msg) return;

 socket.emit("sendMessage",{
  room: ROOM,
  from: ME,
  to: toUser,
  text: msg
 });

 text.value="";

}

/* ================= RECEIVE MESSAGE ================= */

socket.on("newMessage", msg => {

 if(msg.room !== ROOM) return;

 renderMsg(msg);
 scrollBottom();

});

/* ================= UI ================= */

function renderMsg(m){

 const div = document.createElement("div");

 div.className = "msg " + (m.from === ME ? "me" : "other");

 div.innerText = m.text;

 document.getElementById("chat").appendChild(div);

}

function scrollBottom(){

 const box = document.getElementById("chat");
 box.scrollTop = box.scrollHeight;

}

function loadOnlineStatus(){

 fetch("/api/online/" + toUser)
 .then(r=>r.json())
 .then(d=>{

  const st = document.getElementById("statusTxt");

  if(d.online){
   st.innerHTML = " ● Online";
   st.style.color = "green";
  }else{
   st.innerHTML = " ● Offline";
   st.style.color = "gray";
  }

 });

}

function goBack(){
 if(document.referrer){
  history.back();
 }else{
  location.href="/";
 }
}

</script>

</body>
</html>
