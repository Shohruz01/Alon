<!DOCTYPE html>
<html lang="tj">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chats</title>

<style>

body{
 margin:0;
 font-family:system-ui;
 background:#f2f4f8;
}

/* HEADER */

.header{
 background:#2563eb;
 color:white;
 padding:16px;
 text-align:center;
 font-size:18px;
 font-weight:800;
 position:sticky;
 top:0;
}

/* CHAT LIST */

.chat-list{
 padding:12px;
}

.chat-item{
 background:white;
 padding:14px;
 border-radius:14px;
 margin-bottom:10px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 box-shadow:0 4px 10px rgba(0,0,0,.08);
 cursor:pointer;
}

.chat-left{
 display:flex;
 flex-direction:column;
 gap:4px;
}

.chat-name{
 font-weight:800;
 font-size:15px;
}

.chat-last{
 font-size:13px;
 color:#666;
 max-width:220px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

/* BADGE */

.badge{
 background:red;
 color:white;
 padding:4px 8px;
 border-radius:20px;
 font-size:12px;
 font-weight:700;
}

/* EMPTY */

.empty{
 text-align:center;
 padding:30px;
 color:#777;
 font-weight:700;
}

/* LANG */

.lang{
 position:absolute;
 right:10px;
 top:10px;
}

.lang button{
 border:none;
 padding:6px 10px;
 border-radius:8px;
 background:#1e40af;
 color:white;
 font-weight:700;
 margin-left:5px;
}

.backBtn{
 position:fixed;
 top:10px;
 left:10px;
 z-index:999;
 background:#2563eb;
 color:white;
 border:none;
 padding:8px 12px;
 border-radius:10px;
 font-weight:700;
 box-shadow:0 4px 10px rgba(0,0,0,.2);
}

</style>
</head>

<body>

<button onclick="goBack()" class="backBtn">← Назад</button>

<div class="header">

 <span id="titleTxt">💬 Паёмҳо</span>

 <div class="lang">
  <button onclick="setLang('tj')">TJ</button>
  <button onclick="setLang('ru')">RU</button>
 </div>

</div>

<div id="chatList" class="chat-list"></div>

<script>

/* ================= LANGUAGE ================= */

let lang = localStorage.getItem("lang") || "tj";

const TXT = {

 tj:{
  title:"💬 Паёмҳо",
  empty:"Паём нест"
 },

 ru:{
  title:"💬 Сообщения",
  empty:"Сообщений нет"
 }

};

function setLang(l){
 lang = l;
 localStorage.setItem("lang",l);
 applyLang();
}

function applyLang(){
 titleTxt.innerText = TXT[lang].title;
}

applyLang();

/* ================= LOAD USER ================= */

fetch("/api/me",{ credentials:"include" })
.then(r=>r.json())
.then(me=>{

 if(!me.logged){
  location.href="/login.html";
  return;
 }

 const MY_ID = me.user._id; // ✅ Mongo ID

 /* ================= LOAD CHAT LIST ================= */

 fetch("/api/my-chats",{ credentials:"include" })
 .then(r=>r.json())
 .then(list=>{

  const box = document.getElementById("chatList");

  if(!list.length){
   box.innerHTML =
    `<div class="empty">${TXT[lang].empty}</div>`;
   return;
  }

  list.forEach(c=>{

   const other =
    c.users.find(u => u !== MY_ID);

   const div = document.createElement("div");
   div.className = "chat-item";

   div.innerHTML = `

    <div class="chat-left">

     <div class="chat-name">
 👤 ${c.otherName || "User"}
 <span style="font-size:12px;color:${c.online?'green':'gray'}">
  ●
 </span>
</div>

     <div class="chat-last">
      ${c.lastMessage || ""}
     </div>

    </div>

    ${
     c.unread > 0
     ? `<div class="badge">${c.unread}</div>`
     : ""
    }

   `;

   div.onclick = ()=>{
    location.href =
     "/chat.html?to=" + other;
   };

   box.appendChild(div);

  });

 });

});

function goBack(){
 if(document.referrer){
  history.back();
 }else{
  location.href="/";
 }
}

</script>

</body>
</html>
