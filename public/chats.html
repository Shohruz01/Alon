<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Паёмҳо</title>

<style>

body{
 margin:0;
 font-family:Arial;
 background:#f2f2f2;
}

.header{
 background:#2f80ed;
 color:white;
 padding:15px;
 text-align:center;
 font-size:18px;
}

.chat-list{
 padding:10px;
}

.chat-item{
 background:white;
 padding:12px;
 border-radius:12px;
 margin-bottom:8px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.badge{
 background:red;
 color:white;
 padding:2px 7px;
 border-radius:50%;
 font-size:12px;
}

</style>
</head>

<body>

<div class="header">💬 Паёмҳо</div>

<div id="chatList" class="chat-list"></div>

<script>

fetch("/api/me",{credentials:"include"})
.then(r=>r.json())
.then(me=>{

 if(!me.logged){
  location.href="/login.html";
  return;
 }

 fetch("/messages.json")
 .then(r=>r.json())
 .then(list=>{

  const my = me.user.id;

  const rooms = {};

  list.forEach(m=>{

   if(m.from==my || m.to==my){

    const other = m.from==my ? m.to : m.from;

    rooms[other] = m;

   }

  });

  Object.keys(rooms).forEach(uid=>{

   const div = document.createElement("div");
   div.className="chat-item";

   div.innerHTML = `
    <b>User ${uid}</b><br>
    <small>${rooms[uid].text}</small>
   `;

   div.onclick = ()=>{
    location.href="/chat.html?to="+uid;
   };

   chatList.appendChild(div);

  });

 });

});

</script>

</body>
</html>
