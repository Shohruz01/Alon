<!DOCTYPE html>
<html lang="tj">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Edit Profile</title>

<style>

body{
 margin:0;
 background:#f2f3f7;
 font-family:system-ui;
}

/* HEADER */

.header{
 background:white;
 padding:14px;
 font-weight:900;
 text-align:center;
 box-shadow:0 2px 8px rgba(0,0,0,.1);
 position:sticky;
 top:0;
 z-index:10;
}

/* CARD */

.card{
 background:white;
 margin:14px;
 padding:16px;
 border-radius:18px;
 box-shadow:0 6px 16px rgba(0,0,0,.08);
 text-align:center;
}

/* AVATAR */

.avatar{
 width:110px;
 height:110px;
 border-radius:50%;
 object-fit:cover;
 border:3px solid #2563eb;
 margin-bottom:10px;
 background:#eee;
}

/* INPUT */

input{
 width:100%;
 padding:13px;
 margin-top:10px;
 border-radius:12px;
 border:1px solid #ddd;
 font-size:15px;
 outline:none;
}

/* BUTTON */

button{
 width:100%;
 margin-top:14px;
 padding:14px;
 border:none;
 border-radius:14px;
 background:#2563eb;
 color:white;
 font-size:16px;
 font-weight:800;
 cursor:pointer;
}

.upload-btn{
 background:#10b981;
}

/* LANG */

.lang{
 display:flex;
 justify-content:center;
 gap:8px;
 margin-bottom:10px;
}

.lang button{
 width:auto;
 padding:6px 14px;
 font-size:13px;
 border-radius:10px;
}

</style>
</head>
<body>

<div class="header" id="titleTxt">✏ Таҳрири профиль</div>

<div class="card">

<div class="lang">
 <button onclick="setLang('tj')">TJ</button>
 <button onclick="setLang('ru')">RU</button>
</div>

<img id="avatar" class="avatar" src="/avatar.png">

<!-- AVATAR UPLOAD -->

<form id="avatarForm" enctype="multipart/form-data">

<input type="file" name="avatar" accept="image/*">

<button type="submit" class="upload-btn" id="uploadTxt">
 📤 Боркунии сурат
</button>

</form>

<!-- DISPLAY NAME -->

<input id="name" placeholder="Ном">

<input id="city" placeholder="Шаҳр">

<input id="birthyear" type="number" placeholder="Соли таваллуд">

<button type="button" id="saveBtn">💾 Захира кардан</button>

</div>

<script>

/* ================= LANGUAGE ================= */

let lang = localStorage.getItem("lang") || "tj";

const TXT = {

 tj:{
  title:"✏ Таҳрири профиль",
  upload:"📤 Боркунии сурат",
  save:"💾 Захира кардан",
  name:"Ном",
  city:"Шаҳр",
  year:"Соли таваллуд",
  updated:"✅ Профиль нав шуд",
  error:"❌ Хато шуд",
  login:"Аввал ба аккаунт ворид шавед"
 },

 ru:{
  title:"✏ Редактирование профиля",
  upload:"📤 Загрузить фото",
  save:"💾 Сохранить",
  name:"Имя",
  city:"Город",
  year:"Год рождения",
  updated:"✅ Профиль обновлён",
  error:"❌ Ошибка",
  login:"Сначала войдите в аккаунт"
 }

};

const titleTxt = document.getElementById("titleTxt");
const uploadTxt = document.getElementById("uploadTxt");
const saveBtn = document.getElementById("saveBtn");

const name = document.getElementById("name");
const city = document.getElementById("city");
const birthyear = document.getElementById("birthyear");
const avatar = document.getElementById("avatar");

function setLang(l){
 lang=l;
 localStorage.setItem("lang",l);
 applyLang();
}

function applyLang(){

 titleTxt.innerText = TXT[lang].title;
 uploadTxt.innerText = TXT[lang].upload;
 saveBtn.innerText = TXT[lang].save;

 name.placeholder = TXT[lang].name;
 city.placeholder = TXT[lang].city;
 birthyear.placeholder = TXT[lang].year;

}

applyLang();

/* ================= LOAD PROFILE ================= */

fetch("/api/me",{ credentials:"include" })
.then(r=>r.json())
.then(d=>{

 if(!d.logged){
  alert(TXT[lang].login);
  location.href="/login.html";
  return;
 }

 const u = d.user;

 name.value = u.name || "";
 city.value = u.city || "";
 birthyear.value = u.birthyear || "";

 if(u.photo){
  avatar.src = u.photo + "?t=" + Date.now();
 }

});

/* ================= SAVE PROFILE ================= */

saveBtn.onclick = ()=>{

 saveBtn.disabled = true;

 const data = {

  name: name.value.trim(),
  city: city.value.trim(),
  birthyear: birthyear.value.trim()

 };

 fetch("/api/update-profile",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  credentials:"include",
  body:JSON.stringify(data)
 })
 .then(r=>r.json())
 .then(d=>{

  if(d.success){
   alert(TXT[lang].updated);
   location.href="/profile";
  }else{
   alert(TXT[lang].error);
  }

 })
 .catch(()=>{
  alert("Server error");
 })
 .finally(()=>{
  saveBtn.disabled=false;
 });

};

const avatarForm = document.getElementById("avatarForm");

avatarForm.onsubmit = async (e)=>{
 e.preventDefault();

 uploadTxt.disabled = true;

 try{

  const formData = new FormData(avatarForm);

  const res = await fetch("/upload-avatar",{
   method:"POST",
   body: formData,
   credentials:"include"
  });

  const data = await res.json();

  if(data.success){
   alert("✅ Сурат иваз шуд");
   location.reload();
  }else{
   alert("❌ Upload хато");
  }

 }catch(err){

  console.log(err);
  alert("❌ Server error");

 }finally{

  uploadTxt.disabled = false;

 }

};

</script>

</body>
</html>
