<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Category | PiBozor</title>

<style>

/* ================== UI PRO DESIGN ================== */

:root{
 --p:#2563eb;
 --a:#ff4757;
 --bg:#f3f5f9;
 --card:#ffffff;
 --radius:18px;
 --shadow:0 12px 28px rgba(0,0,0,.08);
 --soft:0 6px 14px rgba(0,0,0,.05);
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:system-ui,-apple-system,BlinkMacSystemFont;
}

body{
 background:var(--bg);
 padding-bottom:90px;
}

/* ================= HEADER ================= */

.header{
 position:sticky;
 top:0;
 z-index:1000;
 background:white;
 padding:14px 16px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 box-shadow:var(--soft);
}

.back-btn{
 font-size:22px;
 cursor:pointer;
}

.title{
 font-weight:800;
 font-size:16px;
}

/* ================= TABS ================= */

.tabs{
 margin:10px;
 background:white;
 border-radius:16px;
 display:flex;
 position:relative;
 height:46px;
 overflow:hidden;
 box-shadow:var(--soft);
}

.tab{
 flex:1;
 text-align:center;
 line-height:46px;
 font-weight:700;
 font-size:14px;
 color:#9ca3af;
 cursor:pointer;
 transition:.2s;
}

.tab.active{
 color:#111;
}

.tab-line{
 position:absolute;
 bottom:0;
 left:0;
 width:33.33%;
 height:3px;
 background:var(--p);
 border-radius:10px;
 transition:.25s;
}

/* ================= FILTER BAR ================= */

.filter-bar{
 background:white;
 margin:10px;
 padding:10px;
 border-radius:16px;
 box-shadow:var(--soft);
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.filter-bar select,
.filter-bar input{
 width:100%;
 padding:12px 14px;
 border-radius:12px;
 border:none;
 background:#f1f5f9;
 font-weight:600;
 outline:none;
}

.price-row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

/* ================= ADS GRID ================= */

.ads{
 padding:10px;
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

/* ================= CARD ================= */

.ad-card{
 background:var(--card);
 border-radius:16px;
 overflow:hidden;
 box-shadow:var(--shadow);
 transition:.25s;
 position:relative;
}

.ad-card:active{
 transform:scale(.98);
}

/* IMAGE */

.ad-card img{
 width:100%;
 height:150px;
 object-fit:cover;
}

/* CONTENT */

.ad-info{
 padding:10px;
}

.ad-price{
 font-weight:900;
 font-size:15px;
 color:#16a34a;
}

.ad-title{
 font-size:14px;
 font-weight:700;
 margin-top:4px;
 line-height:1.3;
}

.ad-city{
 font-size:12px;
 color:#6b7280;
 margin-top:4px;
}

.ad-time{
 font-size:11px;
 color:#9ca3af;
 margin-top:4px;
}

/* ================= LIKE BUTTON ================= */

.like-btn{
 position:absolute;
 top:8px;
 right:8px;
 width:34px;
 height:34px;
 border-radius:50%;
 background:white;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:15px;
 box-shadow:var(--soft);
 transition:.2s;
}

.like-btn.active{
 background:var(--a);
 color:white;
}

/* ================= EMPTY ================= */

.empty{
 grid-column:1/-1;
 text-align:center;
 padding:40px;
 color:#6b7280;
 font-weight:700;
}

/* ================= MOBILE FIX ================= */

@media(max-width:420px){

 .tabs{
  margin:8px;
 }

 .filter-bar{
  margin:8px;
  padding:8px;
 }

 .ads{
  padding:8px;
 }

 .ad-card img{
  height:140px;
 }

}

/* ================= TABLET ================= */

@media(min-width:720px){

 .ads{
  grid-template-columns:repeat(3,1fr);
 }

}

.backBtn{
 position:fixed;
 top:10px;
 left:10px;
 z-index:999;
 background:#2563eb;
 color:white;
 border:none;
 padding:8px 12px;
 border-radius:10px;
 font-weight:700;
 box-shadow:0 4px 10px rgba(0,0,0,.2);
}

</style>
</head>

<body>

<script>


/* ================= GET CATEGORY ================= */

/* ================= URL PARAM ================= */

const urlParams = new URLSearchParams(window.location.search);
const CURRENT_CATEGORY = urlParams.get("cat");

const SUBS = {

  {id:"electric", tj:"Электро", ru:"Электро"},

 ],

 Велосипед:[
  {id:"all", tj:"Ҳама", ru:"Все"},
  {id:"mountain", tj:"Кӯҳӣ", ru:"Горный"},
  {id:"city", tj:"Шаҳрӣ", ru:"Городской"},
  {id:"kids", tj:"Кӯдакона", ru:"Детский"}
 ],

 /* ================= TECH ================= */

 Телефон:[

 ],

 Телевизор:[

  {id:"smart", tj:"Smart TV", ru:"Smart TV"},

 ],

 Кор:[

 /* ================= HOME ================= */

 Мебел:[

  {id:"sofa", tj:"Диван", ru:"Диван"},

 ],

 "Асбоби хона":[

 /* ================= OTHER ================= */

 ],

 Ҳайвонот:[

  {id:"dog", tj:"Саг", ru:"Собаки"},
  {id:"cat", tj:"Гурба", ru:"Кошки"},
  {id:"birds", tj:"Паранда", ru:"Птицы"}
 ],

 Китоб:[
  {id:"all", tj:"Ҳама", ru:"Все"},
  {id:"school", tj:"Мактабӣ", ru:"Школьные"},
  {id:"novel", tj:"Роман", ru:"Романы"},
  {id:"religion", tj:"Динӣ", ru:"Религия"}

/* ================= TITLE ================= */

document.getElementById("catTitle").innerText =
 CURRENT_CATEGORY || "Category";

/* ================= ELEMENTS ================= */

const adsBox = document.getElementById("ads");
const citySel = document.getElementById("citySelect");
const searchIn = document.getElementById("searchInput");
const minPriceInput = document.getElementById("minPrice");
const maxPriceInput = document.getElementById("maxPrice");
const subSelect = document.getElementById("subSelect");

/* ================= SUB CATEGORY LOAD ================= */

if(SUBS[CURRENT_CATEGORY]){

 subSelect.innerHTML="";

 SUBS[CURRENT_CATEGORY].forEach(s=>{

  const opt = document.createElement("option");
  opt.value = s.id;
  opt.textContent = s.tj;

  subSelect.appendChild(opt);

 });

}else{
 subSelect.style.display="none";
}

/* ================= DATA ================= */

let ALL_ADS = [];
let CURRENT_TAB = "new";

let likes = JSON.parse(localStorage.getItem("likes")) || {};

/* ================= LOAD ADS ================= */

fetch("/api/ads")
.then(r=>r.json())
.then(data=>{

 ALL_ADS = data.filter(a =>
  a.category === CURRENT_CATEGORY
 );

 renderAds();

})
.catch(err=>{
 console.log("FETCH ERROR:",err);
});

/* ================= RENDER ================= */

function renderAds(){

 let list = [...ALL_ADS];

 const city = citySel.value;
 const search = searchIn.value.toLowerCase();

 const minPrice = Number(minPriceInput.value) || 0;
 const maxPrice = Number(maxPriceInput.value) || Infinity;

 const subCat = subSelect.value;

 /* ---------- SORT ---------- */

 if(CURRENT_TAB==="new"){
  list.sort((a,b)=>b.time - a.time);
 }

 if(CURRENT_TAB==="popular"){
  list.sort((a,b)=>(b.views||0)-(a.views||0));
 }

 if(CURRENT_TAB==="top"){
  list.sort((a,b)=>(b.likes||0)-(a.likes||0));
 }

 /* ---------- FILTERS ---------- */

 if(city){
  list = list.filter(a=>a.city===city);
 }

 list = list.filter(a=>{
  const price = Number(a.price)||0;
  return price>=minPrice && price<=maxPrice;
 });

 if(subCat && subCat!=="all"){
  list = list.filter(a=>a.sub===subCat);
 }

 if(search){
  list = list.filter(a=>
   a.title.toLowerCase().includes(search)
  );
 }

 /* ---------- OUTPUT ---------- */

 adsBox.innerHTML="";

 if(!list.length){
  adsBox.innerHTML=`<div class="empty">Эълон нест</div>`;
  return;
 }

 list.forEach(renderCard);
}

/* ================= CARD ================= */

function renderCard(ad){

 const card=document.createElement("div");
 card.className="ad-card";

 card.onclick=()=>location="/ad.html?id="+ad._id;

 const img=ad.photos?.[0]
 ? ad.photos[0]
 : "/noimage.png";

 card.innerHTML=`

 <div class="like-btn ${likes[ad._id]?"active":""}"
 onclick="event.stopPropagation();toggleLike('${ad._id}',this)">
 ❤️
 </div>

 <img src="${img}">

 <div class="ad-info">

  <div class="ad-price">
   💰 ${formatPrice(ad.price)}
  </div>

  <div class="ad-title">
   ${ad.title}
  </div>

  <div class="ad-city">
   📍 ${ad.city||""}
  </div>

  <div class="ad-time">
   🕒 ${formatDate(ad.time)}
  </div>

 </div>
 `;

 adsBox.appendChild(card);
}

/* ================= LIKE ================= */

function toggleLike(id,btn){

 if(likes[id]) return;

 likes[id]=1;
 btn.classList.add("active");

 fetch("/api/like",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({adId:id})
 });

 localStorage.setItem("likes",JSON.stringify(likes));
}

/* ================= EVENTS ================= */

citySel.addEventListener("change",renderAds);
minPriceInput.addEventListener("input",renderAds);
maxPriceInput.addEventListener("input",renderAds);
subSelect.addEventListener("change",renderAds);

let timer;

searchIn.addEventListener("input",()=>{
 clearTimeout(timer);
 timer=setTimeout(renderAds,300);
});

/* ================= TABS ================= */

function setTab(el,type){

 CURRENT_TAB=type;

 document.querySelectorAll(".tab")
 .forEach(t=>t.classList.remove("active"));

 el.classList.add("active");

 const line=document.querySelector(".tab-line");

 if(type==="new") line.style.left="0%";
 if(type==="popular") line.style.left="33.33%";
 if(type==="top") line.style.left="66.66%";

 renderAds();
}

/* ================= HELPERS ================= */

function formatPrice(p){
 if(!p) return "0";
 return Number(p).toLocaleString("ru-RU")+" сомонӣ";
}

function formatDate(ts){
 if(!ts) return "";
 return new Date(ts).toLocaleDateString();
}

/* ================= LANG ================= */

const translations = {

tj:{
 city:"Ҳамаи шаҳрҳо",
 search:"Ҷустуҷӯ...",
 no_ads:"Эълон нест",
 price_from:"Аз нарх",
 price_to:"То нарх"
},

ru:{
 city:"Все города",
 search:"Поиск...",
 no_ads:"Объявлений нет",
 price_from:"Цена от",
 price_to:"Цена до"
}

};

function setLang(l){
 localStorage.setItem("lang",l);
 applyLang();
}

function applyLang(){

 const lang = localStorage.getItem("lang") || "tj";

 document.querySelectorAll("[data-key]").forEach(el=>{
  const k = el.dataset.key;
  if(translations[lang][k])
   el.innerText = translations[lang][k];
 });

 document.querySelectorAll("[data-key-placeholder]").forEach(el=>{
  const k = el.dataset.keyPlaceholder;
  if(translations[lang][k])
   el.placeholder = translations[lang][k];
 });

}

applyLang();

function goBack(){
 if(document.referrer){
  history.back();
 }else{
  location.href="/";
 }
}

</script>

</html>
