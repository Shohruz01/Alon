<!DOCTYPE html>
<html lang="tj">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Favorites</title>

<style>

body{
 margin:0;
 background:#f2f3f7;
 font-family:system-ui;
}

/* HEADER */

.header{
 font-size:18px;
 font-weight:900;
 padding:14px;
 background:white;
 box-shadow:0 2px 10px rgba(0,0,0,.08);
 display:flex;
 justify-content:space-between;
 align-items:center;
}

/* LANG */

.lang button{
 background:#eef2ff;
 border:none;
 padding:6px 12px;
 border-radius:10px;
 font-weight:700;
}

/* GRID */

.ads{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
 gap:12px;
 padding:12px;
}

/* CARD */

.card{
 background:white;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 4px 12px rgba(0,0,0,.08);
 position:relative;
}

/* IMAGE */

.card img{
 width:100%;
 height:160px;
 object-fit:cover;
}

/* INFO */

.info{
 padding:10px;
}

.price{
 font-weight:900;
 color:#27ae60;
}

.title{
 font-size:14px;
 margin-top:4px;
}

/* REMOVE BTN */

.remove-btn{
 width:90%;
 margin:8px auto 12px;
 padding:10px;
 border:none;
 border-radius:12px;
 background:#ef4444;
 color:white;
 font-weight:800;
 display:block;
}

/* EMPTY */

.empty{
 padding:40px;
 text-align:center;
 color:#777;
 font-weight:700;
}

.backBtn{
 position:fixed;
 top:10px;
 left:10px;
 z-index:999;
 background:#2563eb;
 color:white;
 border:none;
 padding:8px 12px;
 border-radius:10px;
 font-weight:700;
 box-shadow:0 4px 10px rgba(0,0,0,.2);
}

</style>
</head>

<body>

<button onclick="goBack()" class="backBtn">← Назад</button>

<div class="header">
 <span id="titleTxt">❤️ Маъқул</span>

 <div class="lang">
  <button onclick="setLang('tj')">TJ</button>
  <button onclick="setLang('ru')">RU</button>
 </div>
</div>

<div id="favAds" class="ads"></div>

<script>

/* ================= LANGUAGE ================= */

let lang = localStorage.getItem("lang") || "tj";

const TXT = {

 tj:{
  title:"❤️ Эълонҳои маъқул",
  login:"Аввал ворид шавед",
  empty:"Ҳоло эълони маъқул нест",
  remove:"❌ Нест кардан",
  error:"Хато шуд"
 },

 ru:{
  title:"❤️ Избранное",
  login:"Сначала войдите",
  empty:"Нет избранных объявлений",
  remove:"❌ Удалить",
  error:"Ошибка"
 }

};

function setLang(l){
 lang=l;
 localStorage.setItem("lang",l);
 applyLang();
 render();
}

function applyLang(){
 titleTxt.innerText = TXT[lang].title;
}

applyLang();

/* ================= DATA ================= */

let USER_ID = null;
let ALL_ADS = [];

/* ================= LOAD USER ================= */

fetch("/api/me",{ credentials:"include" })
.then(r=>r.json())
.then(me=>{

 if(!me.logged){
  showEmpty(TXT[lang].login);
  return;
 }

 USER_ID = me.user._id || me.user.id;

 loadAds();

});

/* ================= LOAD ADS ================= */

function loadAds(){

 fetch("/api/ads")
 .then(r=>r.json())
 .then(list=>{

  ALL_ADS = list;
  render();

 });

}

/* ================= RENDER ================= */

function render(){

 const box = document.getElementById("favAds");
 box.innerHTML="";

 if(!USER_ID) return;

 const favs = ALL_ADS.filter(ad =>
  ad.likedBy &&
  ad.likedBy.map(String).includes(String(USER_ID))
 );

 if(!favs.length){
  showEmpty(TXT[lang].empty);
  return;
 }

 favs.forEach(ad=>{

  const card = document.createElement("div");
  card.className="card";

  const img = ad.photos?.[0] || "/noimage.png";

  card.onclick = ()=>{
   location.href="/ad.html?id="+ad._id;
  };

  card.innerHTML=`

   <img src="${img}">

   <div class="info">
    <div class="price">💰 ${ad.price}</div>
    <div class="title">${ad.title}</div>
   </div>

   <button class="remove-btn"
    onclick="event.stopPropagation();unlike('${ad._id}')">
    ${TXT[lang].remove}
   </button>

  `;

  box.appendChild(card);

 });

}

/* ================= EMPTY ================= */

function showEmpty(text){

 document.getElementById("favAds").innerHTML = `
  <div class="empty">${text}</div>
 `;

}

/* ================= UNLIKE ================= */

function unlike(id){

 fetch("/api/like",{
  method:"POST",
  headers:{
   "Content-Type":"application/json"
  },
  credentials:"include",
  body:JSON.stringify({ adId:id })
 })
 .then(r=>r.json())
 .then(d=>{

  if(d.success){
   ALL_ADS = ALL_ADS.filter(a => a._id !== id);
   render();
  }else{
   alert(TXT[lang].error);
  }

 });

}

function goBack(){
 if(document.referrer){
  history.back();
 }else{
  location.href="/";
 }
}

</script>

</body>
</html>
