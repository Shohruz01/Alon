<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Эълон</title>

<style>

body{
 margin:0;
 background:#eef2f7;
 font-family:system-ui;
}

/* HEADER */
.top-bar{
 position:sticky;
 top:0;
 height:56px;
 background:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 12px;
 box-shadow:0 2px 10px rgba(0,0,0,.1);
 z-index:1000;
}

/* SLIDER */
#slider{
 display:flex;
 overflow-x:auto;
 scroll-snap-type:x mandatory;
}

#slider img{
 height:auto;
 max-height:60vh;
 object-fit:contain;
 background:#000;
}

/* STATS */
.stats{
 display:flex;
 justify-content:space-between;
 padding:10px 14px;
 font-size:13px;
 color:#444;
}

/* CARD */
.card{
 background:white;
 margin:12px;
 padding:14px;
 padding-bottom:70px
 border-radius:18px;
 box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.price{
 font-size:22px;
 font-weight:900;
 color:#16a34a;
}

.title{
 font-size:18px;
 font-weight:800;
 margin-top:6px;
}

.city{
 color:#666;
 font-size:14px;
}

.phone{
 background:#f1f5f9;
 padding:12px;
 border-radius:12px;
 margin-top:10px;
}

.desc{
 margin-top:10px;
 line-height:1.5;
}

/* BUTTONS */
.action-row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:12px;
}

button{
 border:none;
 height:44px;
 border-radius:12px;
 font-weight:700;
}

#msgBtn,#ownerBtn{
 background:#2563eb;
 color:white;
}

#vipBtn{
 background:#fb8500;
 color:white;
}

#deleteBtn{
 background:#ef4444;
 color:white;
 display:none;
}

/* CALL */
.call-box{
 position:sticky;
 bottom:12px;
 margin:12px auto;
 width:92%;
}

#callBtn{
 width:100%;
 height:50px;
 background:#1e88ff;
 color:white;
 font-weight:800;
 border-radius:16px;
}

/* LIKE */
#likeBtn{
 position:fixed;
 right:12px;
 top:90px;
 width:48px;
 height:48px;
 border-radius:50%;
 background:white;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 6px 18px rgba(0,0,0,.2);
 font-size:22px;
}

#likeBtn.active{
 background:red;
 color:white;
}

/* MODAL */
#imgModal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.95);
 z-index:999999;
 align-items:center;
 justify-content:center;
}

#modalImg{
 max-width:95%;
 max-height:95%;
 border-radius:12px;
}

</style>
</head>

<body>

<div class="top-bar">
 <button onclick="history.back()">⬅</button>
 <b>Эълон</b>
 <div></div>
</div>

<div id="slider"></div>

<div class="stats">
 <div id="likeCount">❤️ 0</div>
 <div id="viewCount">👁 0</div>
 <div id="timeAgo">🕒</div>
</div>

<div class="card">

 <div id="price" class="price"></div>
 <div id="title" class="title"></div>
 <div id="city" class="city"></div>
 <div id="phone" class="phone"></div>
 <div id="desc" class="desc"></div>
 <div id="expireBox" style="
 margin-top:8px;
 padding:10px;
 border-radius:12px;
 background:#fef3c7;
 font-weight:800;
 color:#92400e;
 font-size:13px;
 display:none;
"></div>

 <div class="action-row">
  <button id="msgBtn">💬 Навиштан</button>
  <button id="vipBtn">⭐ VIP</button>
  <button id="ownerBtn">👤 Профил</button>
  <button id="deleteBtn">🗑 Удалить</button>
 </div>

</div>

<div class="call-box">
 <button id="callBtn">📞 Занг задан</button>
</div>

<div id="likeBtn">❤️</div>

<!-- MODAL -->
<div id="imgModal">
 <img id="modalImg">
</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const adId = new URLSearchParams(location.search).get("id");
if(!adId) return alert("ID нест");

const slider = document.getElementById("slider");
const modal = document.getElementById("imgModal");
const modalImg = document.getElementById("modalImg");
const likeBtn = document.getElementById("likeBtn");
const deleteBtn = document.getElementById("deleteBtn");

let CURRENT_AD = null;

// LOAD AD
fetch("/api/ad/"+adId)
.then(r=>r.json())
.then(ad=>{

 if(!ad) return;

 CURRENT_AD = ad;

// SHOW EXPIRE TIME
showExpireTime(ad.expireAt);

 // IMAGES
 slider.innerHTML="";
 ad.photos.forEach(src=>{

  const img=document.createElement("img");
  img.src=src;
  img.onclick=()=>{
   modal.style.display="flex";
   modalImg.src=img.src;
   document.body.style.overflow="hidden";
  };
  slider.appendChild(img);

 });

 // INFO
 price.innerText="💰 "+ad.price;
 title.innerText=ad.title;
 city.innerText="📍 "+ad.city;
 desc.innerText=ad.desc||"";
 checkLoginAndPhone(ad.phone);

 timeAgo.innerText="🕒 "+new Date(ad.time).toLocaleDateString();
 viewCount.innerText="👁 "+(ad.views||0);
 likeCount.innerText="❤️ "+(ad.likes||0);

 // OWNER CHECK
 fetch("/api/me",{credentials:"include"})
 .then(r=>r.json())
 .then(me=>{
  if(me.logged && me.user.id===ad.userId){
   deleteBtn.style.display="block";
  }
 });

});

// CLOSE MODAL
modal.onclick=(e)=>{
 if(e.target.id!=="imgModal") return;
 modal.style.display="none";
 modalImg.src="";
 document.body.style.overflow="";
};

// LIKE
likeBtn.onclick = ()=>{

 fetch("/api/like",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  credentials:"include", // ⭐ МУҲИМ
  body:JSON.stringify({ adId })
 })
 .then(r=>r.json())
 .then(d=>{

  if(!d.success){
   alert(d.message || "Хато");
   return;
  }

  likeCount.innerText = "❤️ " + d.likes;

  if(d.liked){
   likeBtn.classList.add("active");
  }else{
   likeBtn.classList.remove("active");
  }

 });

};

// DELETE
deleteBtn.onclick=async()=>{

 if(!confirm("Удалить?")) return;

 const r = await fetch("/delete-ad/"+CURRENT_AD.id,{
  method:"POST",
  credentials:"include"
 });

 const d = await r.json();

 if(d.success){
  alert("Удалено");
  location="/profile";
 }

};

// PROFILE
ownerBtn.onclick=()=>{
 if(CURRENT_AD)
 location="/user.html?id="+CURRENT_AD.userId;
};

// CALL
callBtn.onclick=()=>{

 fetch("/api/me",{credentials:"include"})
 .then(r=>r.json())
 .then(d=>{

  if(!d.logged){
   goLogin();
   return;
  }

  if(CURRENT_AD)
   location="tel:"+CURRENT_AD.phone;

 });

};

});

function checkLoginAndPhone(phone){

 fetch("/api/me",{credentials:"include"})
 .then(r=>r.json())
 .then(d=>{

  const box = document.getElementById("phone");

  // ===== USER LOGGED =====
  if(d.logged){

   box.innerHTML = `
    📞 <a href="tel:${phone}" style="
     text-decoration:none;
     font-weight:800;
     color:#2563eb
    ">
     ${phone}
    </a>
   `;

  }

  // ===== USER NOT LOGGED =====
  else{

   const masked = maskPhone(phone);

   box.innerHTML = `
    📞 <b>${masked}</b><br>

    <button onclick="goLogin()" style="
     margin-top:8px;
     padding:8px 16px;
     background:#16a34a;
     border:none;
     border-radius:10px;
     color:white;
     font-weight:800
    ">
     👁 Намоиши рақам
    </button>
   `;

  }

 });

}

// MASK NUMBER
function maskPhone(phone){

 if(!phone) return "";

 const clean = phone.replace(/\D/g,"");

 if(clean.length < 7) return phone;

 const start = clean.substring(0,3); // 992
 const end   = clean.substring(clean.length-2); // 45

 return start + "****" + end;
}

// GO LOGIN WITH BACK URL
function goLogin(){

 const back = encodeURIComponent(location.href);

 location.href = "/login.html?back=" + back;
}

// ================= DATE FORMAT =================

function formatDate(ts){

 const d = new Date(ts);

 const day = d.getDate().toString().padStart(2,"0");
 const month = (d.getMonth()+1).toString().padStart(2,"0");
 const year = d.getFullYear();

 return day+"."+month+"."+year;
}

document.getElementById("vipBtn").onclick = ()=>{

 const box = document.createElement("div");

 box.innerHTML = `
  <div style="
   position:fixed;
   bottom:90px;
   left:50%;
   transform:translateX(-50%);
   background:#111;
   color:white;
   padding:14px 18px;
   border-radius:14px;
   font-size:14px;
   z-index:9999;
   box-shadow:0 8px 20px rgba(0,0,0,.4);
  ">
   🚀 VIP ба наздикӣ дастрас мешавад
  </div>
 `;

 document.body.appendChild(box);

 setTimeout(()=>{
  box.remove();
 },2500);

};

function showExpireTime(expireAt){

 if(!expireAt) return;

 const box = document.getElementById("expireBox");
 box.style.display = "block";

 function update(){

  const now = Date.now();
  let diff = expireAt - now;

  if(diff <= 0){
   box.innerHTML = "⛔ Муҳлат анҷом ёфт";
   return;
  }

  const days = Math.floor(diff / (1000*60*60*24));
  diff %= (1000*60*60*24);

  const hours = Math.floor(diff / (1000*60*60));
  diff %= (1000*60*60);

  const mins = Math.floor(diff / (1000*60));

  let text = "⏳ Мондааст: ";

  if(days > 0) text += days + " рӯз ";
  if(hours > 0) text += hours + " соат ";

  text += mins + " дақ";

  box.innerHTML = text;
 }

 update();
 setInterval(update, 60000);
}

</script>

</body>
</html>
