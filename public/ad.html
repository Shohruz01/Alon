<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-key="title_page">Эълон</title>

<style>

body{
 margin:0;
 background:#eef2f7;
 font-family:system-ui;
}

/* HEADER */
.top-bar{
 position:sticky;
 top:0;
 height:56px;
 background:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 12px;
 box-shadow:0 2px 10px rgba(0,0,0,.1);
 z-index:1000;
}

/* SLIDER */
#slider{
 display:flex;
 overflow-x:auto;
 scroll-snap-type:x mandatory;
}

#slider img{
 height:auto;
 max-height:60vh;
 object-fit:contain;
 background:#000;
}

/* STATS */
.stats{
 display:flex;
 justify-content:space-between;
 padding:10px 14px;
 font-size:13px;
 color:#444;
}

/* CARD */
.card{
 background:white;
 margin:12px;
 padding:14px;
 padding-bottom:70px;
 border-radius:18px;
 box-shadow:0 8px 20px rgba(0,0,0,.1);
}

.price{
 font-size:22px;
 font-weight:900;
 color:#16a34a;
}

.title{
 font-size:18px;
 font-weight:800;
 margin-top:6px;
}

.city{
 color:#666;
 font-size:14px;
}

.phone{
 background:#f1f5f9;
 padding:12px;
 border-radius:12px;
 margin-top:10px;
}

.desc{
 margin-top:10px;
 line-height:1.5;
}

/* BUTTONS */
.action-row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:12px;
}

button{
 border:none;
 height:44px;
 border-radius:12px;
 font-weight:700;
}

#msgBtn,#ownerBtn{
 background:#2563eb;
 color:white;
}

#vipBtn{
 background:#fb8500;
 color:white;
}

#deleteBtn{
 background:#ef4444;
 color:white;
 display:none;
}

/* CALL */
.call-box{
 position:sticky;
 bottom:12px;
 margin:12px auto;
 width:92%;
}

#callBtn{
 width:100%;
 height:50px;
 background:#1e88ff;
 color:white;
 font-weight:800;
 border-radius:16px;
}

/* LIKE */
#likeBtn{
 position:fixed;
 right:12px;
 top:90px;
 width:48px;
 height:48px;
 border-radius:50%;
 background:white;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 6px 18px rgba(0,0,0,.2);
 font-size:22px;
}

#likeBtn.active{
 background:red;
 color:white;
}

/* MODAL */
#imgModal{
 display:none;
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.95);
 z-index:999999;
 align-items:center;
 justify-content:center;
}

#modalImg{
 max-width:95%;
 max-height:95%;
 border-radius:12px;
}

.lang-box{
 position:fixed;
 right:12px;
 top:30px;
 z-index:10000;
 background:white;
 padding:6px;
 border-radius:12px;
 box-shadow:0 4px 12px rgba(0,0,0,.2);
}

#catBox{
 margin-top:6px;
 font-size:13px;
 font-weight:700;
 color:#2563eb;
}

.backBtn{
 position:fixed;
 top:10px;
 left:10px;
 z-index:999;
 background:#2563eb;
 color:white;
 border:none;
 padding:8px 12px;
 border-radius:10px;
 font-weight:700;
 box-shadow:0 4px 10px rgba(0,0,0,.2);
}

</style>
</head>

<body>

<button onclick="goBack()" class="backBtn">← Назад</button>

<div class="top-bar">
 <button onclick="history.back()">⬅</button>
 <b data-key="title_page">Эълон</b>
 <div></div>
</div>

<div class="lang-box">
 <button onclick="setLang('tj')">TJ</button>
 <button onclick="setLang('ru')">RU</button>
</div>

<div id="slider"></div>

<div class="stats">
 <div id="likeCount">❤️ 0</div>
 <div id="viewCount">👁 0</div>
 <div id="timeAgo">🕒</div>
</div>

<div class="card">

 <div id="price" class="price"></div>
 <div id="title" class="title"></div>
 <div id="city" class="city"></div>
 <div id="catBox" class="city"></div>
 <div id="phone" class="phone"></div>
 <div id="desc" class="desc"></div>

 <div id="expireBox" style="
 margin-top:8px;
 padding:10px;
 border-radius:12px;
 background:#fef3c7;
 font-weight:800;
 color:#92400e;
 font-size:13px;
 display:none;
"></div>

 <div class="action-row">
  <button id="msgBtn" data-key="btn_msg">💬 Навиштан</button>
  <button id="vipBtn">⭐ VIP</button>
  <button id="ownerBtn" data-key="btn_profile">👤 Профил</button>
  <button id="deleteBtn" data-key="btn_delete">🗑 Удалить</button>
 </div>

</div>

<div class="call-box">
 <button id="callBtn" data-key="btn_call">📞 Занг задан</button>
</div>

<div id="likeBtn">❤️</div>

<!-- MODAL -->
<div id="imgModal">
 <img id="modalImg">
</div>

<script>

/* ================= LANG ================= */

const translations = {

tj:{
 title_page:"Эълон",
 btn_msg:"Навиштан",
 btn_profile:"Профил",
 btn_delete:"Нест кардан",
 btn_call:"Занг задан",
 show_number:"Намоиши рақам",
 expired:"Муҳлат анҷом ёфт",
 left:"Мондааст"
},

ru:{
 title_page:"Объявление",
 btn_msg:"Написать",
 btn_profile:"Профиль",
 btn_delete:"Удалить",
 btn_call:"Позвонить",
 show_number:"Показать номер",
 expired:"Срок истёк",
 left:"Осталось"
}

};

function setLang(l){
 localStorage.setItem("lang",l);
 applyLang();
}

function applyLang(){

 const lang = localStorage.getItem("lang") || "tj";

 document.querySelectorAll("[data-key]").forEach(el=>{
  const k = el.dataset.key;
  if(translations[lang][k]){
   el.innerText = translations[lang][k];
  }
 });

}

applyLang();

/* ================= MAIN ================= */

document.addEventListener("DOMContentLoaded",()=>{

const adId = new URLSearchParams(location.search).get("id");

window.AD_ID = adId;

if(!adId || adId.length !== 24){
 alert("ID хато");
 throw "BAD ID";
}

if(!adId) return alert("ID нест");

const slider = document.getElementById("slider");
const modal = document.getElementById("imgModal");
const modalImg = document.getElementById("modalImg");
const likeBtn = document.getElementById("likeBtn");
const deleteBtn = document.getElementById("deleteBtn");

let CURRENT_AD = null;

/* LOAD AD */

fetch("/api/ad/"+adId)
.then(r=>r.json())
.then(ad=>{

 if(!ad) return;

 CURRENT_AD = ad;

 // ADD VIEW
fetch("/api/add-view",{
 method:"POST",
 headers:{
  "Content-Type":"application/json"
 },
 body: JSON.stringify({ adId })
});


 showExpireTime(ad.expireAt);

  slider.innerHTML = "";

if (!ad.photos || ad.photos.length === 0) {

 const noImg = document.createElement("img");
 noImg.src = "/noimage.png";
 slider.appendChild(noImg);

} else {

 ad.photos.forEach(src => {

  const img = document.createElement("img");

  // ✅ FIX PATH
  img.src = src.startsWith("/uploads")
   ? src
   : "/uploads/" + src;

  img.loading = "lazy";

  img.onerror = () => {
   console.log("IMAGE LOAD ERROR:", img.src);
  };

  img.onclick = () => {
   modal.style.display = "flex";
   modalImg.src = img.src;
   document.body.style.overflow = "hidden";
  };

  slider.appendChild(img);

 });

}

 /* INFO */
 price.innerText="💰 "+formatPrice(ad.price);
 title.innerText=ad.title;
 city.innerText="📍 "+ad.city;
 // CATEGORY + SUB
let catText = ad.category || "";
let subText = ad.sub ? " / " + ad.sub : "";

catBox.innerText = "📂 " + catText + subText;
 desc.innerText=ad.desc || "";

 timeAgo.innerText =
  "🕒 " + new Date(ad.time).toLocaleDateString();

 viewCount.innerText="👁 "+(ad.views||0);
 likeCount.innerText="❤️ "+(ad.likes||0);

 checkLoginAndPhone(ad.phone);

 /* OWNER CHECK */

 fetch("/api/me",{credentials:"include"})
 .then(r=>r.json())
 .then(me=>{

  if(
   me.logged &&
   String(me.user._id) === String(ad.userId)
  ){
   deleteBtn.style.display="block";
  }

 });

});

/* CLOSE MODAL */

modal.onclick=(e)=>{
 if(e.target.id!=="imgModal") return;
 modal.style.display="none";
 modalImg.src="";
 document.body.style.overflow="";
};

/* LIKE */

likeBtn.onclick = ()=>{

 fetch("/api/like",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  credentials:"include",
  body:JSON.stringify({ adId: window.AD_ID })
 })
 .then(r=>r.json())
 .then(d=>{

  if(!d.success){
   alert("Хато");
   return;
  }

  likeCount.innerText="❤️ "+d.likes;

  d.liked
   ? likeBtn.classList.add("active")
   : likeBtn.classList.remove("active");

 });

};

/* DELETE */

deleteBtn.onclick = async ()=>{

 if(!confirm("Удалить?")) return;

 const r = await fetch("/delete-ad/"+CURRENT_AD._id,{
  method:"POST",
  credentials:"include"
 });

 const d = await r.json();

 if(d.success){
  alert("Удалено");
  location="/profile";
 }

};

/* PROFILE */

ownerBtn.onclick=()=>{
 if(CURRENT_AD)
 location="/user.html?id="+CURRENT_AD.userId;
};

/* CHAT */

msgBtn.onclick = ()=>{

 fetch("/api/me",{ credentials:"include" })
 .then(r=>r.json())
 .then(d=>{

  if(!d.logged){
   goLogin();
   return;
  }

  if(!CURRENT_AD) return;

  location = "/chat.html?to=" + CURRENT_AD.userId;

 });

};

/* CALL */

callBtn.onclick=()=>{

 fetch("/api/me",{credentials:"include"})
 .then(r=>r.json())
 .then(d=>{

  if(!d.logged){
   goLogin();
   return;
  }

  location="tel:"+CURRENT_AD.phone;

 });

};

});

/* ================= PHONE ================= */

function checkLoginAndPhone(phone){

 fetch("/api/me",{credentials:"include"})
 .then(r=>r.json())
 .then(d=>{

  const box=document.getElementById("phone");
  const lang=localStorage.getItem("lang")||"tj";

  if(d.logged){

   box.innerHTML=`
    📞 <a href="tel:${phone}"
     style="text-decoration:none;font-weight:800;color:#2563eb">
     ${phone}
    </a>
   `;

  }else{

   const masked=maskPhone(phone);

   box.innerHTML=`
    📞 <b>${masked}</b><br>
    <button onclick="goLogin()"
     style="margin-top:8px;padding:8px 16px;
     background:#16a34a;border:none;border-radius:10px;
     color:white;font-weight:800">
     👁 ${translations[lang].show_number}
    </button>
   `;

  }

 });

}

/* HELPERS */

function maskPhone(phone){

 const c=phone.replace(/\D/g,"");
 return c.substring(0,3)+"****"+c.substring(c.length-2);
}

function goLogin(){

 const back=encodeURIComponent(location.href);
 location="/login.html?back="+back;
}

function formatPrice(p){
 return Number(p||0).toLocaleString("ru-RU")+" сомонӣ";
}

/* EXPIRE */

function showExpireTime(expireAt){

 if(!expireAt) return;

 const box=document.getElementById("expireBox");
 box.style.display="block";

 const lang=localStorage.getItem("lang")||"tj";

 function update(){

  const diff=expireAt-Date.now();

  if(diff<=0){
   box.innerHTML="⛔ "+translations[lang].expired;
   return;
  }

  const d=Math.floor(diff/86400000);
  const h=Math.floor(diff%86400000/3600000);
  const m=Math.floor(diff%3600000/60000);

  box.innerHTML=
   "⏳ "+translations[lang].left+
   ": "+d+"д "+h+"ч "+m+"м";
 }

 update();
 setInterval(update,60000);
}

/* VIP */

vipBtn.onclick=()=>{

 const box=document.createElement("div");

 box.innerHTML=`
 <div style="
 position:fixed;
 bottom:90px;
 left:50%;
 transform:translateX(-50%);
 background:#111;
 color:white;
 padding:14px 18px;
 border-radius:14px;
 z-index:9999">
 🚀 VIP скоро
 </div>`;

 document.body.appendChild(box);

 setTimeout(()=>box.remove(),2500);
};

function goBack(){
 if(document.referrer){
  history.back();
 }else{
  location.href="/";
 }
}

</script>

</body>
</html>
