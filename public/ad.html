<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Эълон</title>

<style>

body{
 margin:0;
 background:#f2f3f7;
 font-family:system-ui;
}

/* HEADER */
                                                              .top-bar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:10px;
 background:white;
 box-shadow:0 2px 6px rgba(0,0,0,.08);                        }

.top-bar button{
 border:none;
 background:none;
 font-size:22px;
}

/* SLIDER */

.slider{                                                       display:flex;
 overflow-x:auto;                                              scroll-snap-type:x mandatory;
}                                                             
.slider img{                                                   width:100%;
 height:260px;
 object-fit:cover;                                             scroll-snap-align:start;
}                                                                                                                           .slider::-webkit-scrollbar{                                    display:none;
}                                                             
/* INFO BAR */                                                
.stats{
 display:flex;
 gap:14px;                                                     padding:10px;                                                 color:#555;                                                   font-size:13px;                                              }
                                                              /* CARD */
                                                              .card{
 background:white;
 margin:10px;
 padding:12px;
 border-radius:14px;
 box-shadow:0 4px 10px rgba(0,0,0,.08);                       }
                                                              /* PRICE */
                                                              .price{
 font-size:22px;                                               font-weight:800;
 color:#27ae60;
}

/* TITLE */
                                                              .title{
 font-size:18px;                                               font-weight:700;
 margin-top:6px;                                              }
                                                              /* CITY */

.city{
 color:#555;
 margin-top:6px;
}                                                             
/* CALL BUTTON */                                             
.call-box{                                                     position:fixed;
 bottom:15px;                                                  left:50%;
 transform:translateX(-50%);
 width:90%;
}

.call-btn{
 width:100%;
 padding:14px;
 border:none;                                                  border-radius:14px;
 background:#2f80ed;                                           color:white;
 font-size:16px;
 font-weight:700;
}

/* LIKE */

.like-btn{
 position:absolute;
 top:14px;
 right:14px;
 background:white;                                             width:40px;
 height:40px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 4px 10px rgba(0,0,0,.2);
 font-size:20px;
}

.like-btn.active{
 background:#ff4757;
 color:white;
 }

.phone{
 margin-top:8px;
 font-weight:700;
 color:#111;
 background:#f5f7fb;
 padding:8px 12px;
 border-radius:10px;
 display:inline-block;
}

.desc{
 margin-top:10px;
 padding:10px;
 background:#f7f9fc;
 border-radius:12px;
 font-size:14px;
 line-height:1.4;
 color:#333;
}

.owner-btn{
 width:100%;
 margin-top:12px;
 padding:12px;
 border:none;
 border-radius:12px;
 background:#2563eb;
 color:white;
 font-size:15px;
 font-weight:700;
 cursor:pointer;
}

.owner-btn:active{
 transform:scale(.97);
}

.vip-btn{
 width:100%;
 margin-top:10px;
 padding:12px;
 border:none;
 border-radius:12px;
 background:linear-gradient(135deg,#f59e0b,#f97316);
 color:white;
 font-size:15px;
 font-weight:800;
 cursor:pointer;
 box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.vip-btn:active{
 transform:scale(.97);
}

</style>

</head>
<body>

<!-- HEADER -->

<div class="top-bar">
 <button onclick="history.back()">⬅</button>
 <div>Эълон</div>
 <div></div>
</div>

<!-- IMAGE SLIDER -->

<div id="slider" class="slider"></div>

<!-- STATS -->

<div class="stats">
 <div id="likeCount">❤️ 0</div>
 <div id="viewCount">👁 0</div>
 <div id="timeAgo">🕒</div>
</div>

<!-- INFO CARD -->

<div class="card">

 <div class="price" id="price"></div>

 <div class="title" id="title"></div>

 <div class="city" id="city"></div>
 <div class="phone" id="phone"></div>
 <div class="desc" id="desc"></div>
 <button class="vip-btn" id="vipBtn">
⭐ VIP — Эълонро боло бардор
</button>
 <button class="owner-btn" id="ownerBtn">
 👤 Профили соҳиби эълон
</button>
</div>

<!-- CALL -->

<div class="call-box">
 <button class="call-btn" id="callBtn">📞 Занг задан</button>
</div>

<!-- LIKE FLOAT -->

<div class="like-btn" id="likeBtn">❤️</div>

<script>

const params = new URLSearchParams(location.search);
const adId = params.get("id");

const slider = document.getElementById("slider");
const likeBtn = document.getElementById("likeBtn");
const likeCount = document.getElementById("likeCount");
const viewCount = document.getElementById("viewCount");
const timeAgo = document.getElementById("timeAgo");

let viewed = JSON.parse(localStorage.getItem("viewedAds")) || {};

// ================= LOAD AD =================

fetch("/api/ad/" + adId)
.then(r => r.json())
.then(ad => {

 CURRENT_AD = ad;

 if(!ad){
  alert("Эълон ёфт нашуд");
  return;
 }

 // IMAGES
 slider.innerHTML = "";
 ad.photos.forEach(img=>{
  const image = document.createElement("img");
  image.src = img;
  slider.appendChild(image);
 });

 // INFO
 document.getElementById("price").innerText = "💰 " + ad.price;
 document.getElementById("title").innerText = ad.title;
 document.getElementById("city").innerText  = "📍 " + ad.city;
 document.getElementById("phone").innerText = "📞 " + ad.phone;
 document.getElementById("desc").innerText = ad.desc || "Тавсиф нест";

 // CALL
 document.getElementById("callBtn").onclick = ()=>{
  location.href = "tel:" + ad.phone;
 };

 // DATE
 timeAgo.innerText = "🕒 " + formatDate(ad.time);

 // VIEWS (ONLY ONCE)
 viewCount.innerText = "👁 " + (ad.views || 0);

 if(!viewed[adId]){
  fetch("/api/add-view",{
   method:"POST",
   headers:{ "Content-Type":"application/json" },
   body:JSON.stringify({ adId })
  });

  viewed[adId] = true;
  localStorage.setItem("viewedAds", JSON.stringify(viewed));
 }

 // LIKES
 likeCount.innerText = "❤️ " + (ad.likes || 0);

 if(ad.likedBy && ad.meId && ad.likedBy.includes(ad.meId)){
  likeBtn.classList.add("active");
 }

});

// OWNER PROFILE BUTTON
document.getElementById("ownerBtn").onclick = ()=>{
 if(!CURRENT_AD){
 alert("Эълон ҳоло бор нашудааст");
 return;
}

location.href = "/user.html?id=" + CURRENT_AD.userId;
};

// ================= LIKE CLICK =================

likeBtn.onclick = ()=>{

 fetch("/api/like",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body:JSON.stringify({ adId })
 })
 .then(r=>r.json())
 .then(d=>{

  if(!d.success){
   alert(d.message);
   return;
  }

  likeCount.innerText = "❤️ " + d.likes;

  if(d.liked){
   likeBtn.classList.add("active");
  }else{
   likeBtn.classList.remove("active");
  }

 });

};

// ================= DATE FORMAT =================

function formatDate(ts){

 const d = new Date(ts);

 const day = d.getDate().toString().padStart(2,"0");
 const month = (d.getMonth()+1).toString().padStart(2,"0");
 const year = d.getFullYear();

 return day+"."+month+"."+year;
}

document.getElementById("vipBtn").onclick = ()=>{

 if(!CURRENT_AD){
  alert("Эълон бор нашудааст");
  return;
 }

 const ok = confirm(
  "VIP кардан = эълонат дар боло меистад.\n\nАрзиши хизмат: 10 сомонӣ\n\nДавом додан?"
 );

 if(!ok) return;

 fetch("/api/make-vip",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body:JSON.stringify({ adId })
 })
 .then(r=>r.json())
 .then(d=>{
  if(d.success){
   alert("✅ Эълон VIP шуд!");
  }else{
   alert(d.message);
  }
 });

};

</script>

</body>
</html>
