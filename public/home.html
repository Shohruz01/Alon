<!DOCTYPE html>
<html lang="tj">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile</title>

<style>

/* ===== RESET ===== */
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 font-family:system-ui;
}

html,body{
 height:100%;
 background:radial-gradient(circle at top,#1a2a3a,#050b14);
}

/* ===== APP ===== */

body{
 display:flex;
 justify-content:center;
 overflow-x:hidden;
 overflow-y:auto;
}

.app{
 width:100%;
 max-width:430px;
 min-height:100vh;
 background:transparent;
 backdrop-filter:blur(12px);
 position:relative;
 overflow:auto;
}

/* ===== HEADER ===== */

.top{
 height:58px;
 padding:0 14px;
 display:flex;
 align-items:center;
 justify-content:space-between;

 position:sticky;
 top:0;
 z-index:99;

 background:rgba(10,20,35,.75);
 backdrop-filter:blur(20px);

 color:white;
 font-weight:700;
 border-bottom:1px solid rgba(255,255,255,.08);
}

.lang button{
 background:rgba(255,255,255,.08);
 color:white;
 border:none;
 padding:6px 12px;
 border-radius:10px;
 font-weight:600;
}

/* ===== PROFILE CARD ===== */

.profile{
 width:calc(100% - 20px);
 margin:14px auto;
 padding:18px;

 background:rgba(255,255,255,.08);
 backdrop-filter:blur(25px);

 border-radius:22px;
 text-align:center;

 box-shadow:0 10px 30px rgba(0,0,0,.4);
 border:1px solid rgba(255,255,255,.12);
}

/* ===== AVATAR ===== */

.avatar{
 width:90px;
 height:90px;
 border-radius:50%;
 border:3px solid #4da3ff;
 margin-bottom:10px;
 background:#222;
}

/* ===== TEXT ===== */

.profile h3{
 color:white;
 margin-bottom:6px;
}

.profile p{
 color:#cfd8dc;
 font-size:14px;
 margin:4px 0;
}

/* ===== BUTTONS ===== */

.btn{
 width:100%;
 margin-top:12px;
 padding:14px;
 border:none;
 border-radius:16px;
 font-size:15px;
 font-weight:700;
 color:white;

 background:linear-gradient(135deg,#1e88ff,#3fa9ff);
 box-shadow:0 6px 16px rgba(0,0,0,.4);
}

.green{
 background:linear-gradient(135deg,#00c853,#64dd17);
}

/* ===== INPUT ===== */

input{
 width:100%;
 padding:12px;
 border-radius:14px;
 border:none;
 margin-top:10px;
 background:rgba(255,255,255,.1);
 color:white;
 outline:none;
}

/* ===== LINKS ===== */

a{
 display:block;
 margin-top:6px;
 color:#64b5ff;
 text-decoration:none;
 font-weight:600;
}

/* ===== ADS GRID ===== */

#adBox{
 padding:12px;
 padding-bottom:100px;
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
 gap:10px;
}

/* ===== AD CARD ===== */

.ad{
 background:rgba(255,255,255,.12);
 backdrop-filter:blur(24px);
 border-radius:18px;
 padding:10px;
 box-shadow:0 8px 24px rgba(0,0,0,.45);
 border:1px solid rgba(255,255,255,.16);
}

.ad img{
 width:100%;
 height:100px;
 object-fit:cover;
 border-radius:12px;
}

/* ===== FLOAT CHAT ===== */

#floatChat{
 position:fixed;
 right:18px;
 bottom:20px;

 width:56px;
 height:56px;
 border-radius:50%;

 background:linear-gradient(135deg,#00e676,#1de9b6);
 color:white;
 font-size:22px;

 display:flex;
 align-items:center;
 justify-content:center;

 box-shadow:0 10px 25px rgba(0,0,0,.5);
 z-index:999;
}

/* ===== STATUS ===== */

.confirmed{
 color:#00e676;
 font-weight:700;
}

.rejected{
 color:#ff5252;
 font-weight:700;
}

/* ===== 2 COLUMN BUTTON GRID ===== */

.btnGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 margin-top:10px;
}

/* button full height align */

.btn{
 margin-top:0;
 padding:14px 10px;
 font-size:14px;
 border-radius:16px;
}

.logout-btn{
 position:absolute;
 right:14px;
 top:14px;

 border:none;
 padding:10px 14px;
 border-radius:12px;

 background:#ff3b3b;
 color:white;
 font-weight:800;
 cursor:pointer;

 box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.ad h4{
 color:#ffffff;
 font-weight:800;
 font-size:16px;
 margin-top:6px;
 letter-spacing:.3px;
 text-shadow:0 1px 2px rgba(0,0,0,.6);
}

.ad p{
 color:#cfd8dc;
 font-size:13px;
 margin-top:4px;
}

.badge{
 color:#9ad1ff;
 font-weight:700;
 font-size:12px;
 margin-bottom:4px;
}

.status{
 color:#7CFF9E;
 font-weight:800;
 font-size:12px;
 margin-bottom:6px;
}

</style>
</head>

<body>

<div class="app">

<!-- ===== HEADER ===== -->

<div class="top">
 <span id="title">Профили ман</span>

 <div class="lang">
  <button onclick="setLang('tj')">TJ</button>
  <button onclick="setLang('ru')">RU</button>
 </div>
</div>

<!-- ===== PROFILE ===== -->

<div class="profile">

<img id="avatar" class="avatar" src="logo.png">

<h3 id="username">...</h3>
<p id="city"></p>
<p id="year"></p>

<div class="btnGrid">

<button class="btn blue" onclick="goHome()">🏠 <span id="homeTxt">Саҳифаи асосӣ</span></button>

<button class="btn blue" onclick="editProfile()">✏ <span id="editTxt">Таҳрири профил</span></button>

<button class="btn green" onclick="addAd()">➕ <span id="addTxt">Иловаи эълон</span></button>

<button class="btn green" onclick="addBooking()">📅 Иловаи брон</button>

</div>

<button onclick="logout()" class="logout-btn">
 🚪 Баромадан
</button>

<h3>Тасдиқи брон</h3>

<input id="codeInput" placeholder="Коди брон">

<button onclick="confirm()">Тасдиқ</button>

<a href="/booking_requests.html">📩 Дархостҳои брон</a>
<a href="/booking_active.html">✅ Бронҳои фаъол</a>
<a href="/booking_history.html">📜 Таърихи брон</a>

</div>

<div id="confirmBox" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
z-index:9999;
align-items:center;
justify-content:center;
">

<div style="
background:white;
padding:20px;
border-radius:16px;
width:90%;
max-width:320px;
text-align:center;
">

<h3>📄 Тасдиқи брон</h3>

<div id="confirmInfo"></div>

<button onclick="approve()" style="
margin-top:10px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#27ae60;
color:white;
font-weight:700;
">
✅ Қабул
</button>

<button onclick="reject()" style="
margin-top:8px;
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#e74c3c;
color:white;
font-weight:700;
">
❌ Рад
</button>

</div>
</div>

<!-- ===== ADS ===== -->

<div id="adBox"></div>

<!-- ===== FLOAT CHAT ===== -->

<div id="floatChat" onclick="openChats()">💬</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

/* ===== SOCKET ===== */

const socket = io();

/* ===== LANGUAGE ===== */

let lang = localStorage.getItem("lang") || "tj";

const TXT={
 tj:{
  title:"Профили ман",
  home:"Саҳифаи асосӣ",
  edit:"Таҳрири профил",
  add:"Иловаи эълон",
  active:"🟢 ФАЪОЛ",
  sold:"🔴 ФУРӮХТА",
  min:"дақ"
 },
 ru:{
  title:"Мой профиль",
  home:"Главная",
  edit:"Редактировать",
  add:"Добавить объявление",
  active:"🟢 АКТИВНО",
  sold:"🔴 ПРОДАНО",
  min:"мин"
 }
};

function applyLang(){
 document.getElementById("title").innerText = TXT[lang].title;
 document.getElementById("homeTxt").innerText = TXT[lang].home;
 document.getElementById("editTxt").innerText = TXT[lang].edit;
 document.getElementById("addTxt").innerText  = TXT[lang].add;
}

function setLang(l){
 lang=l;
 localStorage.setItem("lang",l);
 applyLang();
 renderAds();
}

applyLang();

/* ===== PROFILE DATA ===== */

let MY_ID = null;

fetch("/api/me",{ credentials:"include" })
.then(r=>r.json())
.then(d=>{

 if(!d.logged){
  location.href="/login.html";
  return;
 }

 const u = d.user;

 MY_ID = u._id;

 socket.emit("registerUser", MY_ID);

 document.getElementById("username").innerText =
  u.name || "User";

 document.getElementById("city").innerText =
  "Шаҳр: " + (u.city || "-");

 document.getElementById("year").innerText =
  "Соли таваллуд: " + (u.birthyear || "-");

 if(u.photo){
  document.getElementById("avatar").src =
   u.photo + "?t=" + Date.now();
 }

});

/* ===== ADS ===== */

let ALL=[];

fetch("/api/my-ads",{credentials:"include"})
.then(r=>r.json())
.then(d=>{
 ALL=d;
 renderAds();
});

function timeAgo(t){

 if(!t) return "";

 const diff = Date.now() - t;

 const minutes = Math.floor(diff / 60000);
 const hours   = Math.floor(diff / 3600000);
 const days    = Math.floor(diff / 86400000);

 if(minutes < 1) return "ҳозир";

 if(minutes < 60)
  return minutes + " дақ пеш";

 if(hours < 24)
  return hours + " соат пеш";

 if(days < 7)
  return days + " рӯз пеш";

 // агар зиёда аз 7 рӯз
 const date = new Date(t);

 return date.toLocaleDateString("ru-RU", {
  day:"2-digit",
  month:"2-digit",
  year:"numeric"
 });
}

function renderAds(){

 const adBox = document.getElementById("adBox");

 adBox.innerHTML="";

 if(!ALL.length){
 adBox.innerHTML = `
 <div style="
   grid-column:1/-1;
   margin-top:40px;
   text-align:center;
 ">
   <div style="
     background:rgba(255,255,255,.08);
     padding:18px;
     border-radius:16px;
     display:inline-block;
     color:#fff;
     font-weight:700;
     box-shadow:0 8px 25px rgba(0,0,0,.4);
   ">
     📭 Эълон нест
   </div>
 </div>`;
 return;
}

 ALL.forEach(ad=>{
 
 console.log("DEBUG AD:", ad);

 console.log("AD ID:", ad._id); 

 const img = ad.photos?.[0] || "/noimage.png";

 adBox.innerHTML += `

 <div class="ad" onclick="openItem('${String(ad._id)}', ${ad.booking})">

 <div class="badge">${ad.category || "AD"}</div>

 <div class="status">
  ${ad.status==="sold" ? TXT[lang].sold : TXT[lang].active}
 </div>

 <img src="${img}">

 <h4>${ad.title}</h4>

 <p>🕓 ${timeAgo(ad.time)}</p>

</div>

`;

 });

}

/* ===== ACTIONS ===== */

function deleteAd(id){

 if(!confirm("❗ Эълон нест карда шавад?")) return;

 fetch("/delete-ad/"+id,{
  method:"POST",
  credentials:"include"
 })
 .then(()=>location.reload());

}

function editAd(id){
 location.href="/edit.html?id="+id;
}

function openChat(id){
 location.href="/chat/"+id;
}

function goHome(){
 location.href="/";
}

function editProfile(){
 location.href="/edit-profile.html";
}

function addAd(){
 location.href="/add.html";
}

function openChats(){
 location.href="/chats.html";
}

function addBooking(){
 location.href="/add-booking.html";
}

/* ===== OPEN ITEM ===== */

function openItem(id, isBooking){

 if(!id){
  alert("ID нест");
  return;
 }

 id = String(id);

 if(isBooking === true || isBooking === "true"){
  location.href = "/booking-view.html?id=" + id;
 }else{
  location.href = "/ad.html?id=" + id;
 }

}

function logout(){

 fetch("/logout",{
  method:"GET",
  credentials:"include"
 })
 .then(()=>{
  location.replace("/"); // back button кор намекунад
 });

}

function confirm(){

 const code = document.getElementById("codeInput").value.trim();

 if(code.length !== 6){
  alert("Кодро пурра ворид кунед");
  return;
 }

 // 👉 ба саҳифаи шартнома мегузарем
 location.href = "/confirm.html?code=" + code;

}

</script>

</body>
</html>
