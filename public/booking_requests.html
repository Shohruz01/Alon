<!DOCTYPE html>
<html lang="tj">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дархостҳои брон</title>

<style>
body{
 font-family:system-ui;
 background:#f2f4f8;
 margin:0;
 padding:12px;
}

h2{
 text-align:center;
}

.card{
 background:white;
 padding:12px;
 border-radius:12px;
 margin-bottom:10px;
 box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.btn{
 padding:6px 12px;
 border:none;
 border-radius:6px;
 margin-top:8px;
}

.accept{background:#2ecc71;color:white}
.reject{background:#e74c3c;color:white}
</style>
</head>

<body>

<h2>📩 Дархостҳои брон</h2>

<div id="list">Загрузка...</div>

<script>

async function loadRequests(){

 const res = await fetch("/api/my-booking-requests");
 const data = await res.json();

 const box = document.getElementById("list");

 if(!data.length){
  box.innerHTML = "Дархост нест";
  return;
 }

 box.innerHTML = "";

 data.forEach(b=>{

  box.innerHTML += `
   <div class="card">
    👤 ${b.renterName}<br>
    🏠 ${b.adTitle}<br>

    📅 ${b.date}<br>
    ⏰ ${b.start} - ${b.end}
    
    🧑 ID иҷорагир: ${b.renterId}<br>

    <button class="btn accept" onclick="action(${b.id},'accept')">
     Қабул
    </button>

    <button class="btn reject" onclick="action(${b.id},'reject')">
     Рад
    </button>
   </div>
  `;

 });

}

async function action(id,type){

 await fetch(`/booking-action?id=${id}&action=${type}`);
 loadRequests();

}

loadRequests();

</script>

</body>
</html>
