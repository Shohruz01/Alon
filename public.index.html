<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>PiBozor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">🛒 PiBozor</div>
  <div class="search-box">
    <input id="search" placeholder="Поиск...">
    <select id="filter">
      <option value="">Ҳама</option>
      <option value="телефон">Телефон</option>
      <option value="шим">Либос</option>
      <option value="шим">Мошин</option>
      <option value="шим">Аксесуар</option>
      <option value="шим">Хона</option>
      <option value="шим">Стройматериал</option>
      <option value="шим">Усто</option>
    </select>
  </div>
</header>

<main>
  <div id="ads" class="grid"></div>
</main>

<script>
let allAds = [];

fetch('/api/ads')
  .then(r => r.json())
  .then(data => {
    allAds = data.reverse();
    render(allAds);
  });

function render(list){
  const box = document.getElementById('ads');
  box.innerHTML = '';

  if(list.length === 0){
    box.innerHTML = '<p style="text-align:center">Эълон нест</p>';
    return;
  }

  list.forEach(a=>{
    box.innerHTML += `
      <div class="card">
        <img src="${a.image ? a.image : 'https://via.placeholder.com/300x200'}">
        <h3>${a.title}</h3>
        <p class="price">${a.price} cомонӣ</p>
        <a href="chat.html?id=${a.id}" class="btn">Чат</a>
      </div>
    `;
  });
}

document.getElementById('search').oninput = filterAds;
document.getElementById('filter').onchange = filterAds;

function filterAds(){
  const s = search.value.toLowerCase();
  const f = filter.value.toLowerCase();

  const res = allAds.filter(a=>{
    return a.title.toLowerCase().includes(s) &&
           a.title.toLowerCase().includes(f);
  });

  render(res);
}
</script>
<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <title>Сомонаи эълонҳо</title>
</head>
<body>

<!-- Кнопка барои рафтан ба саҳифаи иловаи эълон -->
<a href="add.html">
  <button>Иловаи эълон</button>
</a>

<!-- Ҷадвали намоиши эълонҳо -->
<div id="adsContainer">
  <!-- Эълонҳо тавассути JavaScript бор карда мешаванд -->
</div>

<script>
  // Агар хоҳед, JavaScript барои бор кардани эълонҳо аз /ads.json
  fetch('/ads')
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('adsContainer');
      data.forEach(ad => {
        const div = document.createElement('div');
        div.innerHTML = `
          <h3>${ad.title}</h3>
          <p>Нарх: ${ad.price}</p>
          <p>Телефон: ${ad.phone || '-'}</p>
          <p>${ad.desc || ''}</p>
          ${ad.image ? `<img src="${ad.image}" width="150">` : ''}
          <hr>
        `;
        container.appendChild(div);
      });
    });
</script>

</body>
</html>
