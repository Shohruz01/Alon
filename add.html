<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Илова эълон</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h2>Илова эълон</h2>
<form action="/add" method="post" enctype="multipart/form-data">
  <input type="text" name="title" placeholder="Номи эълон" required><br>
  <input type="number" name="price" placeholder="Нархи" required><br>
  <input type="text" name="category" placeholder="Категория" required><br>
  <input type="file" name="photo"><br>
  <button type="submit">Илова</button>
</form>
<a href="/">Баргашт ба хона</a>
</body>
</html>
